name: Deploy to GitHub Pages

on:
  # This branch only holds the gongdrum app itself (no homepage/admin files),
  # so it must not auto-deploy to Pages root — that would overwrite the
  # merged site published from claude/hangil-webpage-deploy-ojbij9, which
  # carries the homepage plus this app under /gongdrum/. Use workflow_dispatch
  # here if a manual one-off deploy of just this branch is ever needed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
