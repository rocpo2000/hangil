<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>공드럼 입출고 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#eef1f3;
    --surface:#ffffff;
    --surface-2:#e7ebee;
    --border:#dbe1e6;
    --ink:#182530;
    --ink-muted:#5c6b78;
    --ink-faint:#8b98a3;
    --accent:#245e8c;
    --accent-ink:#ffffff;
    --accent-soft:#e2eefa;
    --in-color:#1f8a4c;
    --in-soft:#e3f5ea;
    --out-color:#b1590f;
    --out-soft:#faeade;
    --danger:#c62828;
    --danger-soft:#fbe6e6;
    --shadow:0 1px 2px rgba(20,30,40,.06), 0 6px 16px -8px rgba(20,30,40,.12);
    --radius:12px;
    --radius-sm:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161c;
      --surface:#1a2229;
      --surface-2:#212b33;
      --border:#2c3844;
      --ink:#eef2f5;
      --ink-muted:#9aa8b3;
      --ink-faint:#6d7a85;
      --accent:#6badde;
      --accent-ink:#0d1a24;
      --accent-soft:#1c2e3d;
      --in-color:#4fce88;
      --in-soft:#173627;
      --out-color:#f0a355;
      --out-soft:#3a2b1a;
      --danger:#f38b8b;
      --danger-soft:#3a1f1f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161c;
    --surface:#1a2229;
    --surface-2:#212b33;
    --border:#2c3844;
    --ink:#eef2f5;
    --ink-muted:#9aa8b3;
    --ink-faint:#6d7a85;
    --accent:#6badde;
    --accent-ink:#0d1a24;
    --accent-soft:#1c2e3d;
    --in-color:#4fce88;
    --in-soft:#173627;
    --out-color:#f0a355;
    --out-soft:#3a2b1a;
    --danger:#f38b8b;
    --danger-soft:#3a1f1f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}

  a{color:var(--accent);}

  .app-header{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .app-header-inner{
    max-width:640px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .brand-mark{color:var(--accent);flex:none;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-title{font-weight:900;font-size:16px;letter-spacing:-.01em;}
  .brand-sub{font-size:11.5px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-faint);}
  .sync-dot[data-state="live"]{background:var(--in-color);}
  .sync-dot[data-state="local"]{background:var(--out-color);}
  .sync-dot[data-state="readonly"]{background:var(--danger);}
  .icon-btn{
    flex:none;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn:active{transform:translateY(1px);}

  .app-main{
    flex:1;
    max-width:640px;width:100%;margin:0 auto;
    padding:16px 16px 100px;
  }

  .banner{
    display:flex;align-items:flex-start;gap:8px;
    background:var(--danger-soft);color:var(--danger);
    border:1px solid var(--danger);
    border-radius:var(--radius-sm);
    padding:10px 12px;font-size:13.5px;line-height:1.5;
    margin-bottom:14px;
  }
  .banner.warn{background:var(--out-soft);color:var(--out-color);border-color:var(--out-color);}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-muted);margin:22px 0 10px;letter-spacing:.02em;}
  .section-title:first-child{margin-top:0;}

  .stock-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  }
  .stock-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);
    border-left:3px solid var(--accent);
    display:flex;flex-direction:column;gap:4px;
  }
  .stock-card .name{font-size:12.5px;color:var(--ink-muted);font-weight:500;line-height:1.3;}
  .stock-card .qty{font-size:26px;font-weight:700;line-height:1.1;}
  .stock-card .qty small{font-size:13px;font-weight:500;color:var(--ink-muted);margin-left:2px;}

  .summary-card{
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 78%, black));
    color:var(--accent-ink);
    border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:16px;
  }
  .summary-card .label{font-size:12.5px;opacity:.85;font-weight:500;}
  .summary-card .value{font-size:34px;font-weight:700;line-height:1;margin-top:4px;}
  .summary-card .value small{font-size:15px;font-weight:500;opacity:.85;margin-left:3px;}
  .summary-card .meta{font-size:12px;opacity:.85;text-align:right;}

  .report-table-wrap{overflow-x:auto;margin-bottom:4px;}
  .report-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;}
  .report-table th,.report-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  .report-table th:first-child,.report-table td:first-child{text-align:left;}
  .report-table thead th{background:var(--surface-2);color:var(--ink-muted);font-weight:700;font-size:12px;}
  .report-table tbody tr:last-child td{border-bottom:none;}
  .report-table td.in{color:var(--in-color);}
  .report-table td.out{color:var(--out-color);}

  .party-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px;margin-bottom:10px;
  }
  .party-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
  .party-card-name{font-weight:700;font-size:14.5px;}
  .party-card-total{font-size:12.5px;color:var(--ink-muted);flex:none;}
  .party-card .report-table{border:none;box-shadow:none;}
  .party-card .report-table thead th{background:transparent;padding-left:0;}
  .party-card .report-table td:first-child, .party-card .report-table th:first-child{padding-left:0;}

  .empty{
    text-align:center;color:var(--ink-muted);font-size:13.5px;
    padding:36px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty a.cta{display:inline-block;margin-top:10px;font-weight:700;}

  .tx-row{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;box-shadow:var(--shadow);
  }
  .pill{
    flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .pill.in{background:var(--in-soft);color:var(--in-color);}
  .pill.out{background:var(--out-soft);color:var(--out-color);}
  .tx-main{flex:1;min-width:0;}
  .tx-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .tx-drum{font-weight:700;font-size:14px;}
  .tx-qty{font-weight:700;font-size:14px;}
  .tx-qty.in{color:var(--in-color);}
  .tx-qty.out{color:var(--out-color);}
  .tx-meta{font-size:12px;color:var(--ink-muted);margin-top:3px;line-height:1.5;}
  .tx-note{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .tx-del{
    flex:none;border:none;background:transparent;color:var(--ink-faint);
    font-size:12px;padding:6px 4px;cursor:pointer;border-radius:6px;
  }
  .tx-del:hover{color:var(--danger);}
  .tx-del.pending{color:var(--danger);font-weight:700;background:var(--danger-soft);padding:6px 8px;}

  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;}
  .seg button{
    border:none;background:transparent;padding:7px 13px;border-radius:999px;font-size:12.5px;
    font-weight:700;color:var(--ink-muted);cursor:pointer;
  }
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  select.filter-select{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;
  }

  form{display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-muted);}
  .field .hint{font-size:11.5px;color:var(--ink-faint);}
  .field .err{font-size:12px;color:var(--danger);font-weight:500;}
  .input, select.input, textarea.input{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:var(--radius-sm);padding:11px 12px;font-size:15.5px;width:100%;
  }
  .input:focus, select.input:focus, textarea.input:focus{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  .field.has-err .input{border-color:var(--danger);}
  textarea.input{resize:vertical;min-height:64px;}
  .qty-wrap{position:relative;}
  .qty-wrap .unit{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    color:var(--ink-muted);font-size:13.5px;pointer-events:none;
  }
  .qty-wrap input{padding-right:34px;}

  .btn{
    border:none;border-radius:var(--radius-sm);padding:13px 18px;font-size:15px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    transition:opacity .15s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.in-btn{background:var(--in-color);color:#08240f;}
  .btn.out-btn{background:var(--out-color);color:#2a1400;}
  .btn.ghost{background:var(--surface-2);color:var(--ink);}
  .btn.danger-ghost{background:var(--danger-soft);color:var(--danger);}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;}

  .stock-hint{font-size:12px;color:var(--ink-muted);margin-top:-2px;}
  .stock-hint b{color:var(--ink);}

  .item-row{margin-bottom:10px;background:var(--surface-2);border-radius:var(--radius);padding:10px;}
  .item-row-top{display:flex;gap:8px;align-items:flex-start;}
  .item-row-main{flex:1;min-width:0;}
  .item-row-qty{width:104px;flex:none;}
  .item-row-good{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .item-del{
    flex:none;width:36px;height:44px;margin-top:1px;
    border:none;background:transparent;color:var(--ink-faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:6px;
  }
  .item-del:hover{color:var(--danger);background:var(--danger-soft);}

  .check-row{margin-bottom:8px;background:var(--surface-2);border-radius:var(--radius);padding:10px;}
  .check-row.checked{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);}
  .check-row-head{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;font-weight:500;}
  .check-row-head input[type="checkbox"]{width:19px;height:19px;flex:none;accent-color:var(--accent);}
  .check-row-fields{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .check-row-fields .field{flex:1;min-width:150px;margin-bottom:0;}

  .result-meta{font-size:12.5px;color:var(--ink-muted);margin-bottom:12px;}

  .type-row{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:8px;
  }
  .type-row .tname{flex:1;font-size:14px;font-weight:500;}
  .type-row .tcount{font-size:11.5px;color:var(--ink-faint);}
  .type-row button{border:none;background:transparent;color:var(--ink-muted);cursor:pointer;padding:6px;border-radius:6px;font-size:12px;}
  .type-row button:hover{color:var(--accent);background:var(--surface-2);}
  .type-row button.del:hover{color:var(--danger);}
  .type-row button.del.pending{color:var(--danger);font-weight:700;background:var(--danger-soft);}
  .type-row button:disabled{opacity:.35;cursor:not-allowed;}
  .type-row.editing{align-items:center;}
  .add-type-row{display:flex;gap:8px;margin-top:12px;}
  .add-type-row input{flex:1;}

  .app-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app-nav-inner{
    max-width:640px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);
  }
  .nav-btn{
    border:none;background:transparent;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 8px;cursor:pointer;font-size:10.5px;font-weight:700;
    border-top:2px solid transparent;
  }
  .nav-btn.active{color:var(--accent);border-top-color:var(--accent);}
  .nav-btn svg{width:21px;height:21px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 22px;text-align:center;}
  .login-mark{color:var(--accent);display:flex;justify-content:center;margin-bottom:10px;}
  .login-title{font-weight:900;font-size:19px;letter-spacing:-.01em;}
  .login-sub{font-size:12.5px;color:var(--ink-muted);margin-top:4px;margin-bottom:18px;}
  .login-seg{justify-content:center;margin-bottom:18px;}
  .login-seg button{flex:1;}
  .login-form{text-align:left;margin-top:4px;}
  .login-form .err{text-align:left;}

  .toast{
    position:fixed;left:50%;bottom:86px;transform:translate(-50%,12px);
    background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:50;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (min-width:640px){
    .stock-grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>

  /* ---------- utils ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function genId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function todayStr(){
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tz).toISOString().slice(0,10);
  }
  function fmtDate(s){
    if (!s) return "";
    var p = s.split("-");
    if (p.length !== 3) return s;
    return p[0] + "." + p[1] + "." + p[2];
  }
  function fmtNum(n){
    n = Number(n) || 0;
    return n.toLocaleString("ko-KR");
  }
  function drumName(id){
    var t = STATE.drumTypes.filter(function(x){ return x.id === id; })[0];
    return t ? t.name : "(삭제된 종류)";
  }
  function computeStock(state){
    var stock = {};
    state.drumTypes.forEach(function(dt){ stock[dt.id] = 0; });
    state.transactions.forEach(function(t){
      if (t.type !== "in" && t.type !== "out") return; // "sold"/"disposed" affect scrap stock, not this
      if (!(t.drumTypeId in stock)) stock[t.drumTypeId] = 0;
      // only the 재생(reclaimable) portion of an inbound entry counts as
      // stock; older entries without a goodQty split count in full, same
      // as before this feature existed.
      var inQty = t.goodQty != null ? t.goodQty : t.qty;
      stock[t.drumTypeId] += (t.type === "in" ? inQty : -t.qty);
    });
    return stock;
  }
  function computeScrapStock(state, drumTypeId){
    var generated = 0, used = 0;
    state.transactions.forEach(function(t){
      if (t.drumTypeId !== drumTypeId) return;
      if (t.type === "in") generated += (t.qty - (t.goodQty != null ? t.goodQty : t.qty));
      else if (t.type === "sold" || t.type === "disposed") used += t.qty;
    });
    return generated - used;
  }
  function computeTypeTotals(state){
    return state.drumTypes.map(function(dt){
      var totalIn = 0, totalGood = 0, totalOut = 0, totalSold = 0, totalDisposed = 0;
      state.transactions.forEach(function(t){
        if (t.drumTypeId !== dt.id) return;
        if (t.type === "in"){ totalIn += t.qty; totalGood += (t.goodQty != null ? t.goodQty : t.qty); }
        else if (t.type === "out") totalOut += t.qty;
        else if (t.type === "sold") totalSold += t.qty;
        else if (t.type === "disposed") totalDisposed += t.qty;
      });
      return {
        id: dt.id, name: dt.name,
        totalIn: totalIn, totalGood: totalGood, totalOut: totalOut,
        totalSold: totalSold, totalDisposed: totalDisposed,
        stock: totalGood - totalOut
      };
    });
  }
  // makes sure the 입고 checklist draft has an entry for every current drum
  // type, without touching values already entered for existing ones.
  function ensureInChecks(d){
    STATE.drumTypes.forEach(function(dt){
      if (!d.checks[dt.id]) d.checks[dt.id] = { checked: false, qty: "", goodQty: "" };
    });
  }
  function typeInUse(state, id){
    return state.transactions.some(function(t){ return t.drumTypeId === id; });
  }
  function partiesKey(kind){ return kind === "in" ? "inParties" : "outParties"; }
  function partyInUse(state, kind, id){
    return state.transactions.some(function(t){ return t.type === kind && t.partyId === id; });
  }

  function restoreDrafts(){
    var raw = ss_get(DRAFT_KEY);
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d && d["in"]) formDrafts["in"] = Object.assign(formDrafts["in"], d["in"]);
      if (d && d["out"]) formDrafts["out"] = Object.assign(formDrafts["out"], d["out"]);
      if (!formDrafts["in"].checks || typeof formDrafts["in"].checks !== "object" || Array.isArray(formDrafts["in"].checks)){
        formDrafts["in"].checks = {};
      }
      formErrors["in"] = { checks: {}, otherCheck: {} };
      if (!Array.isArray(formDrafts["out"].items) || !formDrafts["out"].items.length){
        formDrafts["out"].items = [{ drumTypeId: "", drumTypeOther: "", qty: "" }];
      }
      formErrors["out"] = { items: formDrafts["out"].items.map(function(){ return {}; }) };
      if (d && typeof d.addType === "string") formDrafts.addType = d.addType;
      if (d && d.addParty && typeof d.addParty === "object"){
        if (typeof d.addParty["in"] === "string") formDrafts.addParty["in"] = d.addParty["in"];
        if (typeof d.addParty["out"] === "string") formDrafts.addParty["out"] = d.addParty["out"];
      }
    } catch(e){}

  function publishState(newState, opts){
    opts = opts || {};
    if (syncMode === "local"){
      STATE = newState;
      ls_set(STATE_KEY, JSON.stringify(newState));
      render();
      if (opts.flash) showToast(opts.flash + " · 이 기기에만 저장돼요");
      return Promise.resolve({ ok:true, local:true });
    }
    if (syncMode === "firebase"){
      STATE = newState;
      render();
      return firebaseApi.publish(newState).then(function(){
        if (opts.flash) showToast(opts.flash);
        return { ok:true };
      }, function(err){
        showBanner((err && err.message) || "저장에 실패했어요. 인터넷 연결을 확인해주세요.");
        return { ok:false };
      });
    }
    if (opts.flash) ss_set(FLASH_KEY, opts.flash);
    if (opts.keepTab) ss_set(TAB_KEY, opts.keepTab);
    return artifact.publish(buildFullHTML(newState)).then(function(){
      return { ok:true };
    }, function(err){
      ss_del(FLASH_KEY);
      ss_del(TAB_KEY);
      var code = err && err.code;
      if (code === "conflict"){
        showBanner("다른 사람이 방금 저장했어요. 화면이 곧 새로고침돼요. 입력한 내용은 남아있어요.");
      } else if (code === "not_writer" || code === "not_granted"){
        isReadOnly = true;
        showBanner("읽기 전용 보기라 저장할 수 없어요.");
      } else if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        hasSync = false;
        syncMode = "local";
        showBanner("실시간 동기화를 사용할 수 없어요. 이 기기에만 저장돼요.");
        STATE = newState;
        ls_set(STATE_KEY, JSON.stringify(newState));
        render();
        return { ok:true, local:true };
      } else {
        showBanner((err && err.message) || "저장에 실패했어요. 다시 시도해주세요.");
      }
      return { ok:false, code: code };
    });
  }

  /* ---------- default state ---------- */
  function defaultState(){
    return {
      drumTypes: [
        { id:"dt1", name:"200L 철드럼" },
        { id:"dt2", name:"200L 플라스틱드럼" },
        { id:"dt3", name:"60L 철드럼" },
        { id:"dt4", name:"20L 철드럼" },
        { id:"dt5", name:"20L 페일(플라스틱)" }
      ],
      transactions: [],
      drivers: [],
      inParties: [],
      outParties: [],
      adminPassword: "admin1234"
    };
  }
  function normalizeState(s){
    if (!s || !Array.isArray(s.drumTypes)) s = defaultState();
    if (!Array.isArray(s.transactions)) s.transactions = [];
    if (!Array.isArray(s.drivers)) s.drivers = [];
    if (!Array.isArray(s.inParties) || !Array.isArray(s.outParties)){
      // migrate from the older single shared "parties" list, if present
      var legacy = Array.isArray(s.parties) ? s.parties : [];
      if (!Array.isArray(s.inParties)) s.inParties = legacy.slice();
      if (!Array.isArray(s.outParties)) s.outParties = legacy.slice();
    }
    delete s.parties;
    if (typeof s.adminPassword !== "string" || !s.adminPassword) s.adminPassword = "admin1234";
    return s;
  }
  function loadStateFromDOM(){
    var saved = ls_get(STATE_KEY);
    if (saved){
      try { STATE = JSON.parse(saved); } catch(e){ STATE = null; }
    }
    if (!STATE){
      var el = document.getElementById("state-data");
      try { STATE = JSON.parse(el.textContent); }
      catch(e){ STATE = defaultState(); }
    }
    STATE = normalizeState(STATE);
  }

  /* ---------- render: shell ---------- */
  function render(){
    var app = document.getElementById("app");
    if (!app) return;

    if (!session){
      app.innerHTML = renderLogin();
      return;
    }

    var isAdmin = session.role === "admin";
    var syncState = isReadOnly ? "readonly" : (hasSync ? "live" : "local");
    var syncLabel = isReadOnly ? "읽기 전용" : (hasSync ? "실시간 동기화" : "이 브라우저에만 저장");
    var whoLabel = isAdmin ? "관리자" : session.name;

    var content = "";
    if (activeTab === "settings" && isAdmin) content = renderSettings();
    else if (activeTab === "report" && isAdmin) content = renderReport();
    else if (activeTab === "scrap" && isAdmin) content = renderScrap();
    else if (activeTab === "in") content = renderForm("in");
    else if (activeTab === "out") content = renderForm("out");
    else if (activeTab === "history") content = renderHistory();
    else if (isAdmin) content = renderDashboard();
    else content = renderForm("in");

    var html = "";
    html += '<header class="app-header"><div class="app-header-inner">';
    html += '<div class="brand">';
    html += '<span class="brand-mark">' + iconWrap(ICONS.drum, 26) + '</span>';

    html += '</div></header>';

    html += '<main class="app-main">';
    if (bannerMsg) html += '<div class="banner">' + iconWrap(ICONS.warn, 16) + '<span>' + esc(bannerMsg) + '</span></div>';
    html += content;
    html += '</main>';

    if (activeTab !== "settings"){
      var cols = isAdmin ? 6 : 3;
      html += '<nav class="app-nav"><div class="app-nav-inner" style="grid-template-columns:repeat(' + cols + ',1fr)">';
      if (isAdmin) html += navBtn("dashboard", ICONS.dashboard, "대시보드");
      html += navBtn("in", ICONS.inbox, "입고");
      html += navBtn("out", ICONS.outbox, "출고");
      html += navBtn("history", ICONS.history, isAdmin ? "이력" : "내 기록");
      if (isAdmin) html += navBtn("report", ICONS.report, "현황");
      if (isAdmin) html += navBtn("scrap", ICONS.scrap, "고철");
      html += '</div></nav>';
    }

    app.innerHTML = html;
  }

    html += '<div class="tx-meta">' + fmtDate(t.date) + ' · ' + esc(t.party || "-") + ' · ' + esc(t.handler || "-") + '</div>';

  /* ---------- render: history ---------- */
  function renderHistory(){
    var html = "";
    html += '<div class="filter-row">';
    html += '<div class="seg">';
    [["all","전체"],["in","입고"],["out","출고"]].forEach(function(f){
      html += '<button type="button" class="' + (historyFilterType===f[0]?"active":"") + '" data-action="setHistoryType" data-value="' + f[0] + '">' + f[1] + '</button>';
    });
    html += '</div>';
    html += '<select class="filter-select" data-action="setHistoryDrum">';
    html += '<option value="all"' + (historyFilterDrum==="all"?" selected":"") + '>전체 종류</option>';
    STATE.drumTypes.forEach(function(dt){
      html += '<option value="' + dt.id + '"' + (historyFilterDrum===dt.id?" selected":"") + '>' + esc(dt.name) + '</option>';
    });
    html += '</select>';
    html += '</div>';

    var restrictToOwn = session && session.role === "driver";
    var list = STATE.transactions.filter(function(t){
      if (t.type !== "in" && t.type !== "out") return false;
      if (restrictToOwn){
        // Match records logged through this driver's own login (driverId),
        // and also older/admin-entered records where only the 담당자 name
        // was recorded (no driverId yet) — so nothing they own goes missing.
        var byId = t.driverId && t.driverId === session.driverId;
        var byName = !t.driverId && t.handler === session.name;
        if (!byId && !byName) return false;
      }
      if (historyFilterType !== "all" && t.type !== historyFilterType) return false;
      if (historyFilterDrum !== "all" && t.drumTypeId !== historyFilterDrum) return false;
      return true;
    }).sort(function(a,b){ return b.ts - a.ts; });

    if (list.length === 0){
      html += '<div class="empty">' + (restrictToOwn ? "아직 등록한 기록이 없어요." : "조건에 맞는 기록이 없어요.") + '</div>';
    } else {
      list.forEach(function(t){ html += renderTxRow(t, true); });
    }
    return html;
  }

  /* ---------- render: daily report ---------- */
  function computeDailySummary(date){
    return STATE.drumTypes.map(function(dt){
      var inQty = 0, outQty = 0;
      STATE.transactions.forEach(function(t){
        if (t.date !== date || t.drumTypeId !== dt.id) return;
        if (t.type === "in") inQty += t.qty;
        else if (t.type === "out") outQty += t.qty;
      });
      return { id: dt.id, name: dt.name, in: inQty, out: outQty, net: inQty - outQty };
    });
  }

  // groups a day's transactions by 업체명 (party), each with its own line
  // items (drum type, qty, handler) and an in/out/total for that company.
  function computePartySummary(date){
    var order = [];
    var byName = {};
    STATE.transactions.forEach(function(t){
      if (t.date !== date || (t.type !== "in" && t.type !== "out")) return;
      var key = t.party || "(미지정)";
      if (!byName[key]){ byName[key] = { name: key, in: 0, out: 0, items: [] }; order.push(key); }
      byName[key][t.type] += t.qty;
      byName[key].items.push(t);
    });
    return order.map(function(key){
      var g = byName[key];
      g.items.sort(function(a,b){ return a.ts - b.ts; });
      return { name: g.name, in: g.in, out: g.out, total: g.in + g.out, items: g.items };
    }).sort(function(a,b){ return b.total - a.total; });
  }

    html += '<button type="button" class="btn primary" data-action="downloadExcel" style="margin-top:14px"' + (hasActivity ? "" : " disabled") + '>엑셀로 다운로드</button>';

    if (!hasActivity){
      html += '<div class="empty">이 날짜에 등록된 입출고 기록이 없어요.</div>';
    } else {
      partyGroups.forEach(function(g){

        html += '<span class="party-card-total num">합계 ' + fmtNum(g.total) + '개</span></div>';
        html += '<div class="report-table-wrap"><table class="report-table"><thead><tr><th>구분</th><th>드럼 종류</th><th>수량</th><th>재생/고철</th><th>담당자</th></tr></thead><tbody>';
        g.items.forEach(function(t){
          var isIn = t.type === "in";

          html += '<td class="num ' + (isIn?"in":"out") + '">' + (isIn?"+":"-") + fmtNum(t.qty) + '</td>';
          html += '<td class="num">' + (hasSplit ? (fmtNum(t.goodQty) + ' / ' + fmtNum(t.qty - t.goodQty)) : "-") + '</td>';
          html += '<td>' + esc(t.handler || "-") + '</td></tr>';
        });
        html += '</tbody></table></div>';
        html += '</div>';
      });
    }

    html += '<div class="section-title">종류별 현황</div>';
    if (!hasActivity){
      html += '<div class="empty">이 날짜에 등록된 입출고 기록이 없어요.</div>';
    } else {
      html += '<div class="report-table-wrap"><table class="report-table"><thead><tr><th>드럼 종류</th><th>입고</th><th>출고</th><th>순증감</th></tr></thead><tbody>';
      summary.forEach(function(r){
        html += '<tr><td>' + esc(r.name) + '</td>';
        html += '<td class="num in">' + (r.in ? "+" + fmtNum(r.in) : "-") + '</td>';
        html += '<td class="num out">' + (r.out ? "-" + fmtNum(r.out) : "-") + '</td>';
        html += '<td class="num">' + (r.net > 0 ? "+" : "") + fmtNum(r.net) + '</td></tr>';
      });

  function downloadExcel(){
    if (typeof XLSX === "undefined"){
      showToast("엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요.");
      return;
    }
    var date = reportDate;
    var partyGroups = computePartySummary(date);

    var partyRows = [["업체명", "입고", "출고", "합계"]];
    partyGroups.forEach(function(g){ partyRows.push([g.name, g.in, g.out, g.total]); });

    var detailRows = [["업체명", "구분", "드럼 종류", "수량", "재생드럼", "고철드럼", "담당자", "비고"]];
    partyGroups.forEach(function(g){
      g.items.forEach(function(t){
        var isIn = t.type === "in";
        var hasSplit = isIn && t.goodQty != null && t.goodQty !== t.qty;
        detailRows.push([
          g.name, isIn ? "입고" : "출고",
          drumName(t.drumTypeId), t.qty,
          hasSplit ? t.goodQty : "", hasSplit ? (t.qty - t.goodQty) : "",
          t.handler || "", t.note || ""
        ]);
      });
    });

    var summary = computeDailySummary(date);
    var summaryRows = [["드럼 종류", "입고", "출고", "순증감"]];
    summary.forEach(function(r){ summaryRows.push([r.name, r.in, r.out, r.net]); });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(partyRows), "업체별 요약");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detailRows), "상세");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "종류별 요약");
    XLSX.writeFile(wb, "공드럼_입출고_" + date + ".xlsx");
  }

  function setScrapKind(v){
    scrapDraft.kind = (v === "disposed") ? "disposed" : "sold";
    render();
  }

  function submitScrap(){
    if (isReadOnly) return;
    var errors = {};
    if (!scrapDraft.date) scrapDraft.date = todayStr();
    if (!scrapDraft.drumTypeId) errors.drumTypeId = "드럼 종류를 선택해주세요";
    var qty = parseInt(scrapDraft.qty, 10);
    if (!qty || qty <= 0) errors.qty = "수량을 입력해주세요";
    else if (scrapDraft.drumTypeId){
      var avail = computeScrapStock(STATE, scrapDraft.drumTypeId);
      if (qty > avail) errors.qty = "고철 재고보다 많아요 (현재 " + fmtNum(avail) + "개)";
    }
    scrapErrors = errors;
    if (Object.keys(errors).length){ render(); return; }

    var tx = {
      id: genId(), type: scrapDraft.kind, date: scrapDraft.date, drumTypeId: scrapDraft.drumTypeId,
      qty: qty, note: (scrapDraft.note || "").trim(), ts: Date.now()
    };
    var newState = Object.assign({}, STATE, { transactions: STATE.transactions.concat([tx]) });
    var flashMsg = scrapDraft.kind === "sold" ? "매각을 등록했어요" : "폐기를 등록했어요";

    publishState(newState, { flash: flashMsg }).then(function(res){
      if (res.ok){
        scrapDraft = { date: todayStr(), drumTypeId: scrapDraft.drumTypeId, kind: scrapDraft.kind, qty: "", note: "" };
        scrapErrors = {};
        render();
      } else {
        render();
      }
    });
  }

        html += '</div>';
        if (isAdmin){
          var qtyNum = parseInt(c.qty, 10);

          html += '<div class="field' + (cErr.goodQty?" has-err":"") + '">';

  /* ---------- render: registration result ---------- */

  function field(name,label,type,value,error,placeholder){
    var html = '<div class="field' + (error?" has-err":"") + '">';

    html += '<input class="input" id="f-' + name + '" type="' + type + '" data-field="' + name + '" value="' + esc(value) + '"' + (placeholder?(' placeholder="'+esc(placeholder)+'"'):"") + '>';
    if (error) html += '<div class="err">' + esc(error) + '</div>';
    return html + '</div>';
  }

          html += '<input class="input" style="flex:1" data-field="editParty" data-kind="' + kind + '" value="' + esc(editingPartyValue[kind]) + '">';

  /* ---------- actions ---------- */
  function allowedTabs(){
    return session && session.role === "admin" ? ADMIN_TABS : DRIVER_TABS;
  }
  function switchTab(tab){
    if (!session) return;
    if (allowedTabs().indexOf(tab) === -1) return;
    activeTab = tab;
    if (tab === "in" || tab === "out") formView[tab] = "form";
    pendingDeleteTx = null;
    pendingDeleteType = null;
    pendingDeleteDriver = null;
    pendingDeleteParty = { "in": null, "out": null };
    editingTypeId = null;
    editingDriverId = null;
    editingPartyId = { "in": null, "out": null };
    render();
  }

  function setLoginMode(v){
    loginMode = (v === "admin") ? "admin" : "driver";
    loginError = "";
    render();
  }

  function loginDriverSubmit(){
    var d = formDrafts.login;
    var driver = STATE.drivers.filter(function(x){ return x.id === d.driverId; })[0];
    if (!driver || !d.pin || driver.pin !== d.pin){
      loginError = "이름과 PIN을 다시 확인해주세요";
      render();
      return;
    }
    loginError = "";
    session = { role:"driver", driverId: driver.id, name: driver.name };
    ls_set(SESSION_KEY, JSON.stringify(session));
    formDrafts.login = { driverId:"", pin:"", adminPw:"" };
    activeTab = "in";
    render();
  }

  function loginAdminSubmit(){
    var d = formDrafts.login;
    if (!d.adminPw || d.adminPw !== STATE.adminPassword){
      loginError = "비밀번호가 맞지 않아요";
      render();
      return;
    }
    loginError = "";
    session = { role:"admin" };
    ls_set(SESSION_KEY, JSON.stringify(session));
    formDrafts.login = { driverId:"", pin:"", adminPw:"" };
    activeTab = "dashboard";
    render();
  }

  function logout(){
    session = null;
    ls_del(SESSION_KEY);
    activeTab = "dashboard";
    loginError = "";
    formView = { "in": "form", "out": "form" };
    lastResult = { "in": null, "out": null };
    render();
  }

  function setHistoryType(v){ historyFilterType = v; render(); }
  function setHistoryDrum(v){ historyFilterDrum = v; render(); }

  // resolves an item's chosen drum type against a (possibly already-extended)
  // drumTypes list; returns { id, drumTypes } where drumTypes includes a newly
  // created entry when the typed name didn't already exist.
  function resolveDrumType(item, drumTypes){
    if (item.drumTypeId !== OTHER_DRUM_ID) return { id: item.drumTypeId, drumTypes: drumTypes };
    var typeName = (item.drumTypeOther || "").trim();
    var match = drumTypes.filter(function(t){ return t.name === typeName; })[0];
    if (match) return { id: match.id, drumTypes: drumTypes };
    var newType = { id: genId(), name: typeName };
    return { id: newType.id, drumTypes: drumTypes.concat([newType]) };
  }

  function entryHasErrors(errors){
    if (errors.date || errors.partyId || errors.party || errors.handler) return true;
    return errors.items.some(function(e){ return e && Object.keys(e).length > 0; });
  }

  function validateEntry(kind, d){
    var errors = { items: [] };
    if (!d.date) errors.date = "날짜를 선택해주세요";

    var stock = computeStock(STATE);
    var outTotals = {}; // resolved drumTypeId (or a per-name placeholder) -> summed qty across rows
    d.items.forEach(function(item, idx){
      var itemErr = {};
      if (!item.drumTypeId) itemErr.drumTypeId = "드럼 종류를 선택해주세요";
      else if (item.drumTypeId === OTHER_DRUM_ID && (!item.drumTypeOther || !item.drumTypeOther.trim())) itemErr.drumTypeOther = "드럼 종류를 입력해주세요";
      var qty = parseInt(item.qty, 10);
      if (!qty || qty <= 0) itemErr.qty = "수량을 입력해주세요";
      if (kind === "in" && session && session.role === "admin" && item.goodQty !== "" && item.goodQty != null){
        var goodQty = parseInt(item.goodQty, 10);
        if (isNaN(goodQty) || goodQty < 0) itemErr.goodQty = "0 이상의 숫자를 입력해주세요";
        else if (!itemErr.qty && goodQty > qty) itemErr.goodQty = "입고수량보다 클 수 없어요";
      }
      errors.items[idx] = itemErr;

      if (kind === "out" && !itemErr.drumTypeId && !itemErr.drumTypeOther && !itemErr.qty){
        var stockId = item.drumTypeId;
        if (stockId === OTHER_DRUM_ID){
          var existingType = STATE.drumTypes.filter(function(t){ return t.name === item.drumTypeOther.trim(); })[0];
          stockId = existingType ? existingType.id : ("__new__" + item.drumTypeOther.trim());
        }
        outTotals[stockId] = (outTotals[stockId] || 0) + qty;
      }
    });

    if (kind === "out"){
      Object.keys(outTotals).forEach(function(id){
        var avail = id.indexOf("__new__") === 0 ? 0 : (stock[id] || 0);
        if (outTotals[id] <= avail) return;
        d.items.forEach(function(item, idx){
          if (errors.items[idx].qty) return; // already flagged for its own reason
          var thisId = item.drumTypeId;
          if (thisId === OTHER_DRUM_ID){
            var existingType = STATE.drumTypes.filter(function(t){ return t.name === (item.drumTypeOther || "").trim(); })[0];
            thisId = existingType ? existingType.id : ("__new__" + (item.drumTypeOther || "").trim());
          }
          if (thisId === id) errors.items[idx].qty = "재고보다 많아요 (현재 " + fmtNum(avail) + "개)";
        });
      });
    }

    if (!d.partyId) errors.partyId = "공급처를 선택해주세요";
    else if (d.partyId === OTHER_PARTY_ID && (!d.party || !d.party.trim())) errors.party = kind === "in" ? "공급처를 입력해주세요" : "용도나 출고처를 입력해주세요";
    var isDriver = session && session.role === "driver";
    if (!isDriver && (!d.handler || !d.handler.trim())) errors.handler = "담당자를 입력해주세요";
    return errors;
  }

  function submitEntry(kind){
    if (!session || isReadOnly || submitting[kind]) return;
    var d = formDrafts[kind];
    if (!d.date) d.date = todayStr();
    var errors = validateEntry(kind, d);
    formErrors[kind] = errors;
    if (entryHasErrors(errors)){ render(); return; }

    var isDriver = session.role === "driver";
    var handlerName = isDriver ? session.name : d.handler.trim();
    var partyId, partyName;
    if (d.partyId === OTHER_PARTY_ID){
      partyId = null;
      partyName = d.party.trim();
    } else {
      var pMatch = STATE[partiesKey(kind)].filter(function(p){ return p.id === d.partyId; })[0];
      partyId = d.partyId;
      partyName = pMatch ? pMatch.name : "";
    }

    var newDrumTypes = STATE.drumTypes;
    var resultItems = [];
    var txs = [];
    var ts0 = Date.now();
    d.items.forEach(function(item, i){
      var resolved = resolveDrumType(item, newDrumTypes);
      newDrumTypes = resolved.drumTypes;
      var qty = parseInt(item.qty, 10);
      var dtObj = newDrumTypes.filter(function(t){ return t.id === resolved.id; })[0];
      var goodQty = qty;
      if (kind === "in" && !isDriver && item.goodQty !== "" && item.goodQty != null){
        goodQty = parseInt(item.goodQty, 10);
      }
      resultItems.push({ name: dtObj ? dtObj.name : "", qty: qty, goodQty: kind === "in" ? goodQty : null });
      var tx = {
        id: genId(), type: kind, date: d.date, drumTypeId: resolved.id,
        qty: qty, party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        note: (d.note || "").trim(), ts: ts0 + i
      };
      if (kind === "in") tx.goodQty = goodQty;
      txs.push(tx);
    });
    var newState = Object.assign({}, STATE, { drumTypes: newDrumTypes, transactions: STATE.transactions.concat(txs) });
    if (!isDriver) saveLastHandler(handlerName);

    submitting[kind] = true; render();
    publishState(newState, { flash: (kind==="in"?"입고를 등록했어요":"출고를 등록했어요"), keepTab: kind }).then(function(res){
      submitting[kind] = false;
      if (res.ok){
        lastResult[kind] = {
          date: d.date, partyName: partyName, handlerName: handlerName,
          note: (d.note || "").trim(), items: resultItems
        };
        formView[kind] = "result";
        formDrafts[kind] = {
          date: todayStr(),
          items: [{ drumTypeId: "", drumTypeOther: "", qty: "", goodQty: "" }],
          partyId: d.partyId, party: (d.partyId === OTHER_PARTY_ID ? "" : d.party),
          handler: d.handler, note: ""
        };
        formErrors[kind] = { items: [{}] };
        ss_set(DRAFT_KEY, JSON.stringify(formDrafts));
        render();
      } else {
        render();
      }
    });
  }

  function inEntryHasErrors(errors){
    if (errors.date || errors.partyId || errors.party || errors.handler || errors.noneChecked) return true;
    if (errors.checks && Object.keys(errors.checks).some(function(id){ return errors.checks[id] && Object.keys(errors.checks[id]).length > 0; })) return true;
    if (errors.otherCheck && Object.keys(errors.otherCheck).length > 0) return true;
    return false;
  }

  function validateInEntry(d){
    var errors = { checks: {}, otherCheck: {} };
    if (!d.date) errors.date = "날짜를 선택해주세요";

    var isAdmin = session && session.role === "admin";
    var anyChecked = false;

    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id];
      if (!c || !c.checked) return;
      anyChecked = true;
      var cErr = {};
      var qty = parseInt(c.qty, 10);
      if (!qty || qty <= 0) cErr.qty = "수량을 입력해주세요";
      if (isAdmin && c.goodQty !== "" && c.goodQty != null){
        var goodQty = parseInt(c.goodQty, 10);
        if (isNaN(goodQty) || goodQty < 0) cErr.goodQty = "0 이상의 숫자를 입력해주세요";
        else if (!cErr.qty && goodQty > qty) cErr.goodQty = "입고수량보다 클 수 없어요";
      }
      if (Object.keys(cErr).length) errors.checks[dt.id] = cErr;
    });

    if (d.otherChecked){
      anyChecked = true;
      var oErr = {};
      if (!d.otherName || !d.otherName.trim()) oErr.name = "드럼 종류를 입력해주세요";
      var oQty = parseInt(d.otherQty, 10);
      if (!oQty || oQty <= 0) oErr.qty = "수량을 입력해주세요";
      if (isAdmin && d.otherGoodQty !== "" && d.otherGoodQty != null){
        var oGood = parseInt(d.otherGoodQty, 10);
        if (isNaN(oGood) || oGood < 0) oErr.goodQty = "0 이상의 숫자를 입력해주세요";
        else if (!oErr.qty && oGood > oQty) oErr.goodQty = "입고수량보다 클 수 없어요";
      }
      if (Object.keys(oErr).length) errors.otherCheck = oErr;
    }

    if (!anyChecked) errors.noneChecked = "드럼 종류를 하나 이상 선택해주세요";

    if (!d.partyId) errors.partyId = "공급처를 선택해주세요";
    else if (d.partyId === OTHER_PARTY_ID && (!d.party || !d.party.trim())) errors.party = "공급처를 입력해주세요";
    var isDriver = session && session.role === "driver";
    if (!isDriver && (!d.handler || !d.handler.trim())) errors.handler = "담당자를 입력해주세요";
    return errors;
  }

  function submitInEntry(){
    if (!session || isReadOnly || submitting["in"]) return;
    var d = formDrafts["in"];
    ensureInChecks(d);
    if (!d.date) d.date = todayStr();
    var errors = validateInEntry(d);
    formErrors["in"] = errors;
    if (inEntryHasErrors(errors)){ render(); return; }

    var isDriver = session.role === "driver";
    var isAdmin = session.role === "admin";
    var handlerName = isDriver ? session.name : d.handler.trim();
    var partyId, partyName;
    if (d.partyId === OTHER_PARTY_ID){
      partyId = null;
      partyName = d.party.trim();
    } else {
      var pMatch = STATE.inParties.filter(function(p){ return p.id === d.partyId; })[0];
      partyId = d.partyId;
      partyName = pMatch ? pMatch.name : "";
    }

    var newDrumTypes = STATE.drumTypes;
    var resultItems = [];
    var txs = [];
    var ts0 = Date.now();
    var seq = 0;

    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id];
      if (!c || !c.checked) return;
      var qty = parseInt(c.qty, 10);
      var goodQty = qty;
      if (isAdmin && c.goodQty !== "" && c.goodQty != null) goodQty = parseInt(c.goodQty, 10);
      resultItems.push({ name: dt.name, qty: qty, goodQty: goodQty });
      txs.push({
        id: genId(), type: "in", date: d.date, drumTypeId: dt.id,
        qty: qty, goodQty: goodQty, party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        note: (d.note || "").trim(), ts: ts0 + (seq++)
      });
    });

    if (d.otherChecked){
      var resolved = resolveDrumType({ drumTypeId: OTHER_DRUM_ID, drumTypeOther: d.otherName }, newDrumTypes);
      newDrumTypes = resolved.drumTypes;
      var oQty = parseInt(d.otherQty, 10);
      var oGood = oQty;
      if (isAdmin && d.otherGoodQty !== "" && d.otherGoodQty != null) oGood = parseInt(d.otherGoodQty, 10);
      var dtObj = newDrumTypes.filter(function(t){ return t.id === resolved.id; })[0];
      resultItems.push({ name: dtObj ? dtObj.name : "", qty: oQty, goodQty: oGood });
      txs.push({
        id: genId(), type: "in", date: d.date, drumTypeId: resolved.id,
        qty: oQty, goodQty: oGood, party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        note: (d.note || "").trim(), ts: ts0 + (seq++)
      });
    }

    var newState = Object.assign({}, STATE, { drumTypes: newDrumTypes, transactions: STATE.transactions.concat(txs) });
    if (!isDriver) saveLastHandler(handlerName);

    submitting["in"] = true; render();
    publishState(newState, { flash: "입고를 등록했어요", keepTab: "in" }).then(function(res){
      submitting["in"] = false;
      if (res.ok){
        lastResult["in"] = {
          date: d.date, partyName: partyName, handlerName: handlerName,
          note: (d.note || "").trim(), items: resultItems
        };
        formView["in"] = "result";
        formDrafts["in"] = {
          date: todayStr(), checks: {},
          otherChecked: false, otherName: "", otherQty: "", otherGoodQty: "",
          partyId: d.partyId, party: (d.partyId === OTHER_PARTY_ID ? "" : d.party),
          handler: d.handler, note: ""
        };
        ensureInChecks(formDrafts["in"]);
        formErrors["in"] = { checks: {}, otherCheck: {} };
        ss_set(DRAFT_KEY, JSON.stringify(formDrafts));
        render();
      } else {
        render();
      }
    });
  }

  function addItem(kind){
    formDrafts[kind].items.push({ drumTypeId: "", drumTypeOther: "", qty: "", goodQty: "" });
    if (formErrors[kind] && formErrors[kind].items) formErrors[kind].items.push({});
    render();
  }
  function removeItem(kind, idx){
    if (formDrafts[kind].items.length <= 1) return;
    formDrafts[kind].items.splice(idx, 1);
    if (formErrors[kind] && formErrors[kind].items) formErrors[kind].items.splice(idx, 1);
    render();
  }
  function startNewEntry(kind){
    formView[kind] = "form";
    render();
  }

  function deleteTx(id){
    if (!session || isReadOnly) return;
    if (session.role === "driver"){
      var own = STATE.transactions.filter(function(t){ return t.id === id; })[0];
      var ownedById = own && own.driverId && own.driverId === session.driverId;
      var ownedByName = own && !own.driverId && own.handler === session.name;
      if (!own || (!ownedById && !ownedByName)) return;
    }
    if (pendingDeleteTx !== id){ pendingDeleteTx = id; render(); return; }
    pendingDeleteTx = null;
    var newState = Object.assign({}, STATE, { transactions: STATE.transactions.filter(function(t){ return t.id !== id; }) });
    publishState(newState, { flash: "기록을 삭제했어요" }).then(function(){ render(); });
  }

  function addType(){
    if (isReadOnly) return;
    var name = (formDrafts.addType || "").trim();
    if (!name){ formErrors.addType = "종류 이름을 입력해주세요"; render(); return; }
    if (STATE.drumTypes.some(function(t){ return t.name === name; })){
      formErrors.addType = "이미 있는 이름이에요";
      render();
      return;
    }
    formErrors.addType = "";
    var newType = { id: genId(), name: name };
    var newState = Object.assign({}, STATE, { drumTypes: STATE.drumTypes.concat([newType]) });
    formDrafts.addType = "";
    publishState(newState, { flash: "드럼 종류를 추가했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function startTypeEdit(id){
    var t = STATE.drumTypes.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    editingTypeId = id;
    editingTypeValue = t.name;
    render();
  }
  function cancelTypeEdit(){ editingTypeId = null; render(); }
  function saveTypeEdit(id){
    var name = (editingTypeValue || "").trim();
    if (!name) return;
    var newState = Object.assign({}, STATE, {
      drumTypes: STATE.drumTypes.map(function(t){ return t.id === id ? Object.assign({}, t, { name: name }) : t; })
    });
    editingTypeId = null;
    publishState(newState, { flash: "이름을 수정했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function deleteType(id){
    if (isReadOnly || typeInUse(STATE, id)) return;
    if (pendingDeleteType !== id){ pendingDeleteType = id; render(); return; }
    pendingDeleteType = null;
    var newState = Object.assign({}, STATE, { drumTypes: STATE.drumTypes.filter(function(t){ return t.id !== id; }) });
    publishState(newState, { flash: "드럼 종류를 삭제했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function addParty(kind){
    if (isReadOnly) return;
    var key = partiesKey(kind);
    var name = (formDrafts.addParty[kind] || "").trim();
    if (!name){ formErrors.addParty[kind] = "이름을 입력해주세요"; render(); return; }
    if (STATE[key].some(function(p){ return p.name === name; })){
      formErrors.addParty[kind] = "이미 있는 이름이에요";
      render();
      return;
    }
    formErrors.addParty[kind] = "";
    var newParty = { id: genId(), name: name };
    var patch = {}; patch[key] = STATE[key].concat([newParty]);
    var newState = Object.assign({}, STATE, patch);
    formDrafts.addParty[kind] = "";
    publishState(newState, { flash: (kind==="in"?"입고 공급처를 추가했어요":"출고처를 추가했어요"), keepTab: "settings" }).then(function(){ render(); });
  }
  function startPartyEdit(kind, id){
    var p = STATE[partiesKey(kind)].filter(function(x){ return x.id === id; })[0];
    if (!p) return;
    editingPartyId[kind] = id;
    editingPartyValue[kind] = p.name;
    render();
  }
  function cancelPartyEdit(kind){ editingPartyId[kind] = null; render(); }
  function savePartyEdit(kind, id){
    var name = (editingPartyValue[kind] || "").trim();
    if (!name) return;
    var key = partiesKey(kind);
    var patch = {}; patch[key] = STATE[key].map(function(p){ return p.id === id ? Object.assign({}, p, { name: name }) : p; });
    var newState = Object.assign({}, STATE, patch);
    editingPartyId[kind] = null;
    publishState(newState, { flash: "이름을 수정했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function deleteParty(kind, id){
    if (isReadOnly || partyInUse(STATE, kind, id)) return;
    if (pendingDeleteParty[kind] !== id){ pendingDeleteParty[kind] = id; render(); return; }
    pendingDeleteParty[kind] = null;
    var key = partiesKey(kind);
    var patch = {}; patch[key] = STATE[key].filter(function(p){ return p.id !== id; });
    var newState = Object.assign({}, STATE, patch);
    publishState(newState, { flash: (kind==="in"?"입고 공급처를 삭제했어요":"출고처를 삭제했어요"), keepTab: "settings" }).then(function(){ render(); });
  }

  function addDriver(){
    if (isReadOnly) return;
    var name = (formDrafts.addDriver.name || "").trim();
    var pin = (formDrafts.addDriver.pin || "").trim();
    var error = "";
    if (!name) error = "이름을 입력해주세요";
    else if (!/^\d{4}$/.test(pin)) error = "PIN은 숫자 4자리로 입력해주세요";
    else if (STATE.drivers.some(function(dr){ return dr.name === name; })) error = "이미 있는 이름이에요";
    if (error){ formErrors.addDriver = error; render(); return; }
    formErrors.addDriver = "";
    var newDriver = { id: genId(), name: name, pin: pin };
    var newState = Object.assign({}, STATE, { drivers: STATE.drivers.concat([newDriver]) });
    formDrafts.addDriver = { name:"", pin:"" };
    publishState(newState, { flash: "기사님을 등록했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function startDriverEdit(id){
    var dr = STATE.drivers.filter(function(x){ return x.id === id; })[0];
    if (!dr) return;
    editingDriverId = id;
    editingDriverName = dr.name;
    editingDriverPin = dr.pin;
    render();
  }
  function cancelDriverEdit(){ editingDriverId = null; render(); }
  function saveDriverEdit(id){
    var name = (editingDriverName || "").trim();
    var pin = (editingDriverPin || "").trim();
    if (!name || !/^\d{4}$/.test(pin)) return;
    var newState = Object.assign({}, STATE, {
      drivers: STATE.drivers.map(function(dr){ return dr.id === id ? Object.assign({}, dr, { name:name, pin:pin }) : dr; })
    });
    editingDriverId = null;
    publishState(newState, { flash: "기사 정보를 수정했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function deleteDriver(id){
    if (isReadOnly) return;
    if (pendingDeleteDriver !== id){ pendingDeleteDriver = id; render(); return; }
    pendingDeleteDriver = null;
    var newState = Object.assign({}, STATE, { drivers: STATE.drivers.filter(function(dr){ return dr.id !== id; }) });
    publishState(newState, { flash: "기사님을 삭제했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function changeAdminPassword(){
    if (isReadOnly) return;
    var pw = (formDrafts.adminPw.value || "").trim();
    if (pw.length < 4){ formErrors.adminPw = "4자 이상 입력해주세요"; render(); return; }
    formErrors.adminPw = "";
    var newState = Object.assign({}, STATE, { adminPassword: pw });
    formDrafts.adminPw = { value:"" };
    publishState(newState, { flash: "관리자 비밀번호를 변경했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  /* ---------- event delegation ---------- */
  function onClick(e){
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;
    if (action === "switchTab"){ e.preventDefault(); switchTab(t.dataset.tab); }
    else if (action === "setHistoryType"){ setHistoryType(t.dataset.value); }
    else if (action === "deleteTx"){ deleteTx(t.dataset.id); }
    else if (action === "addType"){ addType(); }
    else if (action === "startTypeEdit"){ startTypeEdit(t.dataset.id); }
    else if (action === "cancelTypeEdit"){ cancelTypeEdit(); }
    else if (action === "saveTypeEdit"){ saveTypeEdit(t.dataset.id); }
    else if (action === "deleteType"){ if (!t.disabled) deleteType(t.dataset.id); }
    else if (action === "addParty"){ addParty(t.dataset.kind); }
    else if (action === "startPartyEdit"){ startPartyEdit(t.dataset.kind, t.dataset.id); }
    else if (action === "cancelPartyEdit"){ cancelPartyEdit(t.dataset.kind); }
    else if (action === "savePartyEdit"){ savePartyEdit(t.dataset.kind, t.dataset.id); }
    else if (action === "deleteParty"){ if (!t.disabled) deleteParty(t.dataset.kind, t.dataset.id); }
    else if (action === "setLoginMode"){ setLoginMode(t.dataset.value); }
    else if (action === "logout"){ logout(); }
    else if (action === "addDriver"){ addDriver(); }
    else if (action === "startDriverEdit"){ startDriverEdit(t.dataset.id); }
    else if (action === "cancelDriverEdit"){ cancelDriverEdit(); }
    else if (action === "saveDriverEdit"){ saveDriverEdit(t.dataset.id); }
    else if (action === "deleteDriver"){ deleteDriver(t.dataset.id); }
    else if (action === "changeAdminPw"){ changeAdminPassword(); }
    else if (action === "addItem"){ addItem(t.dataset.kind); }
    else if (action === "removeItem"){ removeItem(t.dataset.kind, parseInt(t.dataset.idx, 10)); }
    else if (action === "startNewEntry"){ startNewEntry(t.dataset.kind); }
    else if (action === "downloadExcel"){ downloadExcel(); }
    else if (action === "setScrapKind"){ setScrapKind(t.dataset.value); }
  }
  function onSubmit(e){
    var f = e.target.closest("form[data-action-submit]");
    if (!f) return;
    e.preventDefault();
    var kind = f.dataset.actionSubmit;
    if (kind === "loginDriver"){ loginDriverSubmit(); }
    else if (kind === "loginAdmin"){ loginAdminSubmit(); }
    else if (kind === "scrap"){ submitScrap(); }
    else if (kind === "in"){ submitInEntry(); }
    else { submitEntry(kind); }
  }
  function onInput(e){
    var el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    if (el.dataset.field === "checkToggle" || el.dataset.field === "otherToggle") return; // handled in onChange
    if (el.dataset.field === "checkQty" || el.dataset.field === "checkGoodQty"){
      var checkId = el.dataset.id;
      var dIn = formDrafts["in"];
      if (!dIn.checks[checkId]) dIn.checks[checkId] = { checked: false, qty: "", goodQty: "" };
      dIn.checks[checkId][el.dataset.field === "checkGoodQty" ? "goodQty" : "qty"] = el.value;
      scheduleDraftSave();
      return;
    }
    if (el.dataset.field === "otherName" || el.dataset.field === "otherQty" || el.dataset.field === "otherGoodQty"){
      formDrafts["in"][el.dataset.field] = el.value;
      scheduleDraftSave();
      return;
    }
    if (el.dataset.field === "reportDate"){ reportDate = el.value; render(); return; }
    if (el.dataset.field === "scrapDate"){ scrapDraft.date = el.value; return; }
    if (el.dataset.field === "scrapDrumTypeId"){ scrapDraft.drumTypeId = el.value; return; }
    if (el.dataset.field === "scrapQty"){ scrapDraft.qty = el.value; return; }
    if (el.dataset.field === "scrapNote"){ scrapDraft.note = el.value; return; }
    if (el.dataset.field === "editType"){ editingTypeValue = el.value; return; }
    if (el.dataset.field === "addType"){ formDrafts.addType = el.value; scheduleDraftSave(); return; }
    if (el.dataset.field === "editParty"){ editingPartyValue[el.dataset.kind] = el.value; return; }
    if (el.dataset.field === "addParty"){ formDrafts.addParty[el.dataset.kind] = el.value; scheduleDraftSave(); return; }
    if (el.dataset.field === "editDriverName"){ editingDriverName = el.value; return; }
    if (el.dataset.field === "editDriverPin"){ editingDriverPin = el.value; return; }
    if (el.dataset.field === "itemDrumTypeId" || el.dataset.field === "itemDrumTypeOther" || el.dataset.field === "itemQty" || el.dataset.field === "itemGoodQty"){
      var itemForm = el.closest("[data-form]");
      if (!itemForm) return;
      var itemKind = itemForm.dataset.form;
      var idx = parseInt(el.dataset.idx, 10);
      var items = formDrafts[itemKind] && formDrafts[itemKind].items;
      if (!items || !items[idx]) return;
      var itemKey = el.dataset.field === "itemDrumTypeId" ? "drumTypeId" : el.dataset.field === "itemDrumTypeOther" ? "drumTypeOther" : el.dataset.field === "itemGoodQty" ? "goodQty" : "qty";
      items[idx][itemKey] = el.value;
      scheduleDraftSave();
      return;
    }
    var form = el.closest("[data-form]");
    if (form){
      var kind = form.dataset.form;
      if (kind === "_addType" || kind === "_addParty") return; // already handled above by field name
      if (formDrafts[kind]) formDrafts[kind][el.dataset.field] = el.value;
      // login / driver-PIN / admin-password fields hold credentials: keep them
      // in memory only, never mirrored into sessionStorage.
      if (kind !== "login" && kind !== "addDriver" && kind !== "adminPw"){
        scheduleDraftSave();
      }
    }
  }
  function onChange(e){
    var el = e.target;
    if (el.dataset && el.dataset.action === "setHistoryDrum"){ setHistoryDrum(el.value); return; }
    if (el.dataset && el.dataset.field === "checkToggle"){
      var checkId = el.dataset.id;
      var dIn = formDrafts["in"];
      ensureInChecks(dIn);
      if (!dIn.checks[checkId]) dIn.checks[checkId] = { checked: false, qty: "", goodQty: "" };
      dIn.checks[checkId].checked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    if (el.dataset && el.dataset.field === "otherToggle"){
      formDrafts["in"].otherChecked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    onInput(e);
    if (el.dataset && (el.dataset.field === "partyId" || el.dataset.field === "itemDrumTypeId" || el.dataset.field === "itemGoodQty" || el.dataset.field === "itemQty" || el.dataset.field === "scrapDrumTypeId" || el.dataset.field === "checkQty" || el.dataset.field === "checkGoodQty" || el.dataset.field === "otherQty" || el.dataset.field === "otherGoodQty")){ render(); }
  }

  /* ---------- init ---------- */
  function restoreSession(){
    var raw = ls_get(SESSION_KEY);
    if (!raw) return;
    try {
      var s = JSON.parse(raw);
      if (s && s.role === "admin"){
        session = s;
      } else if (s && s.role === "driver" && s.driverId && STATE.drivers.some(function(d){ return d.id === s.driverId; })){
        session = s;
      } else {
        ls_del(SESSION_KEY);
      }
    } catch(e){ ls_del(SESSION_KEY); }
  }

  function init(){
    loadStateFromDOM();
    restoreSession();
    restoreDrafts();
    if (!formDrafts["in"].handler) formDrafts["in"].handler = lastHandler();
    if (!formDrafts["out"].handler) formDrafts["out"].handler = lastHandler();
    if (!formDrafts["in"].date) formDrafts["in"].date = todayStr();
    if (!formDrafts["out"].date) formDrafts["out"].date = todayStr();

    var flash = ss_get(FLASH_KEY);
    if (flash) ss_del(FLASH_KEY);
    var nextTab = ss_get(TAB_KEY);
    if (nextTab){ ss_del(TAB_KEY); activeTab = nextTab; }
    else if (session){ activeTab = session.role === "admin" ? "dashboard" : "in"; }
    if (session && allowedTabs().indexOf(activeTab) === -1){
      activeTab = session.role === "admin" ? "dashboard" : "in";
    }

    var app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("submit", onSubmit);
    app.addEventListener("input", onInput);
    app.addEventListener("change", onChange);

    render();
    if (flash) showToast(flash);

    if (window.claude && typeof window.claude.use === "function"){
      window.claude.use("artifact").then(function(ns){
        artifact = ns;
        hasSync = !!ns;
        syncMode = hasSync ? "claude" : "local";
        render();
      }).catch(function(){ hasSync = false; syncMode = "local"; render(); });
    } else if (window.__gongdrumFirebaseReady){
      window.__gongdrumFirebaseReady.then(function(api){
        firebaseApi = api;
        hasSync = true;
        syncMode = "firebase";
        var firstSnapshot = true;
        api.subscribe(function(remote){
          if (remote){
            STATE = normalizeState(remote);
          } else if (firstSnapshot){
            firebaseApi.publish(STATE);
          }
          firstSnapshot = false;
          render();
        });
      }).catch(function(){ hasSync = false; syncMode = "local"; render(); });
    } else {
      hasSync = false;
      syncMode = "local";
      render();
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
