<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>공드럼 입출고 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#eef1f3;
    --surface:#ffffff;
    --surface-2:#e7ebee;
    --border:#dbe1e6;
    --ink:#182530;
    --ink-muted:#5c6b78;
    --ink-faint:#8b98a3;
    --accent:#245e8c;
    --accent-ink:#ffffff;
    --accent-soft:#e2eefa;
    --in-color:#1f8a4c;
    --in-soft:#e3f5ea;
    --out-color:#b1590f;
    --out-soft:#faeade;
    --danger:#c62828;
    --danger-soft:#fbe6e6;
    --shadow:0 1px 2px rgba(20,30,40,.06), 0 6px 16px -8px rgba(20,30,40,.12);
    --radius:12px;
    --radius-sm:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161c;
      --surface:#1a2229;
      --surface-2:#212b33;
      --border:#2c3844;
      --ink:#eef2f5;
      --ink-muted:#9aa8b3;
      --ink-faint:#6d7a85;
      --accent:#6badde;
      --accent-ink:#0d1a24;
      --accent-soft:#1c2e3d;
      --in-color:#4fce88;
      --in-soft:#173627;
      --out-color:#f0a355;
      --out-soft:#3a2b1a;
      --danger:#f38b8b;
      --danger-soft:#3a1f1f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161c;
    --surface:#1a2229;
    --surface-2:#212b33;
    --border:#2c3844;
    --ink:#eef2f5;
    --ink-muted:#9aa8b3;
    --ink-faint:#6d7a85;
    --accent:#6badde;
    --accent-ink:#0d1a24;
    --accent-soft:#1c2e3d;
    --in-color:#4fce88;
    --in-soft:#173627;
    --out-color:#f0a355;
    --out-soft:#3a2b1a;
    --danger:#f38b8b;
    --danger-soft:#3a1f1f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}

  a{color:var(--accent);}

  .app-header{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .app-header-inner{
    max-width:640px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .brand-mark{color:var(--accent);flex:none;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-title{font-weight:900;font-size:16px;letter-spacing:-.01em;}
  .brand-sub{font-size:11.5px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-faint);}
  .sync-dot[data-state="live"]{background:var(--in-color);}
  .sync-dot[data-state="local"]{background:var(--out-color);}
  .sync-dot[data-state="readonly"]{background:var(--danger);}
  .icon-btn{
    flex:none;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn:active{transform:translateY(1px);}

  .app-main{
    flex:1;
    max-width:640px;width:100%;margin:0 auto;
    padding:16px 16px 100px;
  }

  .banner{
    display:flex;align-items:flex-start;gap:8px;
    background:var(--danger-soft);color:var(--danger);
    border:1px solid var(--danger);
    border-radius:var(--radius-sm);
    padding:10px 12px;font-size:13.5px;line-height:1.5;
    margin-bottom:14px;
  }
  .banner.warn{background:var(--out-soft);color:var(--out-color);border-color:var(--out-color);}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-muted);margin:22px 0 10px;letter-spacing:.02em;}
  .section-title:first-child{margin-top:0;}

  .stock-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  }
  .stock-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);
    border-left:3px solid var(--accent);
    display:flex;flex-direction:column;gap:4px;
  }
  .stock-card .name{font-size:12.5px;color:var(--ink-muted);font-weight:500;line-height:1.3;}
  .stock-card .qty{font-size:26px;font-weight:700;line-height:1.1;}
  .stock-card .qty small{font-size:13px;font-weight:500;color:var(--ink-muted);margin-left:2px;}

  .summary-card{
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 78%, black));
    color:var(--accent-ink);
    border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:16px;
  }
  .summary-card .label{font-size:12.5px;opacity:.85;font-weight:500;}
  .summary-card .value{font-size:34px;font-weight:700;line-height:1;margin-top:4px;}
  .summary-card .value small{font-size:15px;font-weight:500;opacity:.85;margin-left:3px;}
  .summary-card .meta{font-size:12px;opacity:.85;text-align:right;}

  .report-table-wrap{overflow-x:auto;margin-bottom:4px;}
  .report-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;}
  .report-table th,.report-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  .report-table th:first-child,.report-table td:first-child{text-align:left;}
  .report-table thead th{background:var(--surface-2);color:var(--ink-muted);font-weight:700;font-size:12px;}
  .report-table tbody tr:last-child td{border-bottom:none;}
  .report-table td.in{color:var(--in-color);}
  .report-table td.out{color:var(--out-color);}

  .party-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px;margin-bottom:10px;
  }
  .party-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
  .party-card-name{font-weight:700;font-size:14.5px;}
  .party-card-total{font-size:12.5px;color:var(--ink-muted);flex:none;}
  .party-card .report-table{border:none;box-shadow:none;}
  .party-card .report-table thead th{background:transparent;padding-left:0;}
  .party-card .report-table td:first-child, .party-card .report-table th:first-child{padding-left:0;}

  .empty{
    text-align:center;color:var(--ink-muted);font-size:13.5px;
    padding:36px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty a.cta{display:inline-block;margin-top:10px;font-weight:700;}

  .tx-row{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;box-shadow:var(--shadow);
  }
  .pill{
    flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .pill.in{background:var(--in-soft);color:var(--in-color);}
  .pill.out{background:var(--out-soft);color:var(--out-color);}
  .tx-main{flex:1;min-width:0;}
  .tx-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .tx-drum{font-weight:700;font-size:14px;}
  .tx-qty{font-weight:700;font-size:14px;}
  .tx-qty.in{color:var(--in-color);}
  .tx-qty.out{color:var(--out-color);}
  .tx-meta{font-size:12px;color:var(--ink-muted);margin-top:3px;line-height:1.5;}
  .tx-note{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .tx-del{
    flex:none;border:none;background:transparent;color:var(--ink-faint);
    font-size:12px;padding:6px 4px;cursor:pointer;border-radius:6px;
  }
  .tx-del:hover{color:var(--danger);}
  .tx-del.pending{color:var(--danger);font-weight:700;background:var(--danger-soft);padding:6px 8px;}

  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;}
  .seg button{
    border:none;background:transparent;padding:7px 13px;border-radius:999px;font-size:12.5px;
    font-weight:700;color:var(--ink-muted);cursor:pointer;
  }
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  select.filter-select{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;
  }

  form{display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-muted);}
  .field .hint{font-size:11.5px;color:var(--ink-faint);}
  .field .err{font-size:12px;color:var(--danger);font-weight:500;}
  .input, select.input, textarea.input{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:var(--radius-sm);padding:11px 12px;font-size:15.5px;width:100%;
  }
  .input:focus, select.input:focus, textarea.input:focus{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  .field.has-err .input{border-color:var(--danger);}
  textarea.input{resize:vertical;min-height:64px;}
  .qty-wrap{position:relative;}
  .qty-wrap .unit{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    color:var(--ink-muted);font-size:13.5px;pointer-events:none;
  }
  .qty-wrap input{padding-right:34px;}

  .btn{
    border:none;border-radius:var(--radius-sm);padding:13px 18px;font-size:15px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    transition:opacity .15s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.in-btn{background:var(--in-color);color:#08240f;}
  .btn.out-btn{background:var(--out-color);color:#2a1400;}
  .btn.ghost{background:var(--surface-2);color:var(--ink);}
  .btn.danger-ghost{background:var(--danger-soft);color:var(--danger);}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;}

  .stock-hint{font-size:12px;color:var(--ink-muted);margin-top:-2px;}
  .stock-hint b{color:var(--ink);}

  .item-row{margin-bottom:10px;background:var(--surface-2);border-radius:var(--radius);padding:10px;}
  .item-row-top{display:flex;gap:8px;align-items:flex-start;}
  .item-row-main{flex:1;min-width:0;}
  .item-row-qty{width:104px;flex:none;}
  .item-row-good{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .item-del{
    flex:none;width:36px;height:44px;margin-top:1px;
    border:none;background:transparent;color:var(--ink-faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:6px;
  }
  .item-del:hover{color:var(--danger);background:var(--danger-soft);}

  .check-row{margin-bottom:8px;background:var(--surface-2);border-radius:var(--radius);padding:10px;}
  .check-row.checked{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);}
  .check-row-head{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;font-weight:500;}
  .check-row-head input[type="checkbox"]{width:19px;height:19px;flex:none;accent-color:var(--accent);}
  .check-row-fields{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .check-row-fields .field{flex:1;min-width:150px;margin-bottom:0;}

  .result-meta{font-size:12.5px;color:var(--ink-muted);margin-bottom:12px;}

  .type-row{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:8px;
  }
  .type-row .tname{flex:1;font-size:14px;font-weight:500;}
  .type-row .tcount{font-size:11.5px;color:var(--ink-faint);}
  .type-row button{border:none;background:transparent;color:var(--ink-muted);cursor:pointer;padding:6px;border-radius:6px;font-size:12px;}
  .type-row button:hover{color:var(--accent);background:var(--surface-2);}
  .type-row button.del:hover{color:var(--danger);}
  .type-row button.del.pending{color:var(--danger);font-weight:700;background:var(--danger-soft);}
  .type-row button:disabled{opacity:.35;cursor:not-allowed;}
  .type-row.editing{align-items:center;}
  .add-type-row{display:flex;gap:8px;margin-top:12px;}
  .add-type-row input{flex:1;}

  .app-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app-nav-inner{
    max-width:640px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);
  }
  .nav-btn{
    border:none;background:transparent;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 8px;cursor:pointer;font-size:10.5px;font-weight:700;
    border-top:2px solid transparent;
  }
  .nav-btn.active{color:var(--accent);border-top-color:var(--accent);}
  .nav-btn svg{width:21px;height:21px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 22px;text-align:center;}
  .login-mark{color:var(--accent);display:flex;justify-content:center;margin-bottom:10px;}
  .login-title{font-weight:900;font-size:19px;letter-spacing:-.01em;}
  .login-sub{font-size:12.5px;color:var(--ink-muted);margin-top:4px;margin-bottom:18px;}
  .login-form{text-align:left;margin-top:4px;}
  .login-form .err{text-align:left;}

  .toast{
    position:fixed;left:50%;bottom:86px;transform:translate(-50%,12px);
    background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:50;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (min-width:640px){
    .stock-grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>

  /* ---------- utils ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function genId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function todayStr(){
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tz).toISOString().slice(0,10);
  }
  function fmtDate(s){
    if (!s) return "";
    var p = s.split("-");
    if (p.length !== 3) return s;
    return p[0] + "." + p[1] + "." + p[2];
  }
  function fmtNum(n){
    n = Number(n) || 0;
    return n.toLocaleString("ko-KR");
  }
  function drumName(id){
    var t = STATE.drumTypes.filter(function(x){ return x.id === id; })[0];
    return t ? t.name : "(삭제된 종류)";
  }
  function computeStock(state){
    var stock = {};
    state.drumTypes.forEach(function(dt){ stock[dt.id] = 0; });
    state.transactions.forEach(function(t){
      if (!(t.drumTypeId in stock)) stock[t.drumTypeId] = 0;
      if (t.type === "produced"){
        // 하루 재생 드럼 수량: 별도 체크리스트로 등록되는, 실제로 재고를
        // 늘리는 처리 실적. 어떤 입고 건과도 1:1로 묶여있지 않다.
        stock[t.drumTypeId] += t.qty;
      } else if (t.type === "in" || t.type === "out"){
        // 재생/생산이 입고와 분리되기 전의 기존 입고 기록은 goodQty에
        // 재생 수량이 그대로 남아있으므로 예전과 같이 계산한다 (없으면
        // 그 시절 기사님 입고처럼 전량 재고로 들어간 것으로 본다).
        // 이 기능 이후 새로 생기는 입고 기록은 goodQty를 항상 명시적으로
        // 채워두므로(기사님 전량 0, 관리자는 늘 0) 아래 fallback을 다시
        // 타지 않는다.
        var inQty = t.goodQty != null ? t.goodQty : t.qty;
        stock[t.drumTypeId] += (t.type === "in" ? inQty : -t.qty);
      }
    });
    return stock;
  }
  function computeScrapStock(state, drumTypeId){
    var generated = 0, used = 0;
    state.transactions.forEach(function(t){
      if (t.drumTypeId !== drumTypeId) return;
      if (t.type === "in") generated += (t.qty - (t.goodQty != null ? t.goodQty : t.qty));
      else if (t.type === "produced" || t.type === "sold" || t.type === "disposed") used += t.qty;
    });
    return generated - used;
  }
  function computeTypeTotals(state){
    return state.drumTypes.map(function(dt){
      var totalIn = 0, totalGood = 0, totalOut = 0, totalSold = 0, totalDisposed = 0;
      state.transactions.forEach(function(t){
        if (t.drumTypeId !== dt.id) return;
        if (t.type === "in"){ totalIn += t.qty; totalGood += (t.goodQty != null ? t.goodQty : t.qty); }
        else if (t.type === "produced") totalGood += t.qty;
        else if (t.type === "out") totalOut += t.qty;
        else if (t.type === "sold") totalSold += t.qty;
        else if (t.type === "disposed") totalDisposed += t.qty;
      });
      return {
        id: dt.id, name: dt.name,
        totalIn: totalIn, totalGood: totalGood, totalOut: totalOut,
        totalSold: totalSold, totalDisposed: totalDisposed,
        stock: totalGood - totalOut
      };
    });
  }
  // makes sure the 입고 checklist draft has an entry for every current drum
  // type, without touching values already entered for existing ones. also
  // backfills the admin-only "하루 재생 드럼 수량" checklist, entered fully
  // independently of which types were checked for 입고 that day.
  function ensureInChecks(d){
    STATE.drumTypes.forEach(function(dt){
      if (!d.checks[dt.id]) d.checks[dt.id] = { checked: false, qty: "" };
      if (!d.produced[dt.id]) d.produced[dt.id] = { checked: false, qty: "" };
    });
  }
  // same as ensureInChecks but for the 출고 checklist draft (no goodQty split
  // needed there); also backfills the admin-only 매각/폐기 checklists that
  // live on the same draft since the 고철 tab was folded into 출고.
  function ensureOutChecks(d){
    STATE.drumTypes.forEach(function(dt){
      if (!d.checks[dt.id]) d.checks[dt.id] = { checked: false, qty: "" };
      if (!d.scrapSold[dt.id]) d.scrapSold[dt.id] = { checked: false, qty: "" };
      if (!d.scrapDisposed[dt.id]) d.scrapDisposed[dt.id] = { checked: false, qty: "" };
    });
  }
  function typeInUse(state, id){
    return state.transactions.some(function(t){ return t.drumTypeId === id; });
  }
  function partiesKey(kind){ return kind === "in" ? "inParties" : "outParties"; }

  // 두 목록 모두에서 중복 여부를 확인한다.
  function usernameTaken(state, username, excludeId){

    var inDrivers = state.drivers.some(function(dr){ return dr.id !== excludeId && dr.username.toLowerCase() === lower; });
    if (inDrivers) return true;

  function publishState(newState, opts){
    opts = opts || {};
    if (syncMode === "local"){
      STATE = newState;
      ls_set(STATE_KEY, JSON.stringify(newState));
      render();
      if (opts.flash) showToast(opts.flash + " · 이 기기에만 저장돼요");
      return Promise.resolve({ ok:true, local:true });
    }
    if (syncMode === "firebase"){
      STATE = newState;
      render();
      return firebaseApi.publish(newState).then(function(){
        if (opts.flash) showToast(opts.flash);
        return { ok:true };
      }, function(err){
        showBanner((err && err.message) || "저장에 실패했어요. 인터넷 연결을 확인해주세요.");
        return { ok:false };
      });
    }
    if (opts.flash) ss_set(FLASH_KEY, opts.flash);
    if (opts.keepTab) ss_set(TAB_KEY, opts.keepTab);
    return artifact.publish(buildFullHTML(newState)).then(function(){
      return { ok:true };
    }, function(err){
      ss_del(FLASH_KEY);
      ss_del(TAB_KEY);
      var code = err && err.code;
      if (code === "conflict"){
        showBanner("다른 사람이 방금 저장했어요. 화면이 곧 새로고침돼요. 입력한 내용은 남아있어요.");
      } else if (code === "not_writer" || code === "not_granted"){
        isReadOnly = true;
        showBanner("읽기 전용 보기라 저장할 수 없어요.");
      } else if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        hasSync = false;
        syncMode = "local";
        showBanner("실시간 동기화를 사용할 수 없어요. 이 기기에만 저장돼요.");
        STATE = newState;
        ls_set(STATE_KEY, JSON.stringify(newState));
        render();
        return { ok:true, local:true };
      } else {
        showBanner((err && err.message) || "저장에 실패했어요. 다시 시도해주세요.");
      }
      return { ok:false, code: code };
    });
  }

  /* ---------- default state ---------- */
  function defaultState(){
    return {
      drumTypes: [
        { id:"dt1", name:"200L 철드럼" },
        { id:"dt2", name:"200L 플라스틱드럼" },
        { id:"dt3", name:"60L 철드럼" },
        { id:"dt4", name:"20L 철드럼" },
        { id:"dt5", name:"20L 페일(플라스틱)" }
      ],
      transactions: [],
      drivers: [],
      admins: [
        { id:"admin-default-general", username:"admin", name:"전체관리자", password:"admin1234", type:"general" }
      ],
      inParties: [],
      outParties: []
    };
  }
  function normalizeState(s){
    if (!s || !Array.isArray(s.drumTypes)) s = defaultState();
    if (!Array.isArray(s.transactions)) s.transactions = [];
    if (!Array.isArray(s.drivers)) s.drivers = [];
    // 기사님 로그인이 이름 선택 + PIN 방식이던 시절의 기록은 아이디·비밀번호
    // 방식으로 옮겨준다 (이름을 아이디로, PIN을 비밀번호로 그대로 사용).
    s.drivers = s.drivers.map(function(dr){
      var out = Object.assign({}, dr);
      if (typeof out.username !== "string" || !out.username) out.username = out.name || ("driver-" + out.id);
      if (typeof out.password !== "string" || !out.password) out.password = out.pin || "0000";
      delete out.pin;
      return out;
    });
    // 생산관리자/전체관리자가 유형별 공용 비밀번호 하나만 쓰던 시절의 상태는
    // 각 유형당 계정 하나씩으로 옮겨준다 (이후 설정에서 이름을 바꾸거나
    // 계정을 더 추가할 수 있음).
    if (!Array.isArray(s.admins)){
      s.admins = [
        { id: genId(), username: "production", name: "생산관리자", password: s.adminPasswordProd || s.adminPassword || "admin1234", type: "production" },
        { id: genId(), username: "general", name: "전체관리자", password: s.adminPasswordGeneral || s.adminPassword || "admin1234", type: "general" }
      ];
    }
    delete s.adminPasswordProd;
    delete s.adminPasswordGeneral;
    delete s.adminPassword;
    if (!Array.isArray(s.inParties) || !Array.isArray(s.outParties)){
      // migrate from the older single shared "parties" list, if present
      var legacy = Array.isArray(s.parties) ? s.parties : [];
      if (!Array.isArray(s.inParties)) s.inParties = legacy.slice();
      if (!Array.isArray(s.outParties)) s.outParties = legacy.slice();
    }
    delete s.parties;
    return s;
  }
  function loadStateFromDOM(){
    var saved = ls_get(STATE_KEY);
    if (saved){
      try { STATE = JSON.parse(saved); } catch(e){ STATE = null; }
    }
    if (!STATE){
      var el = document.getElementById("state-data");
      try { STATE = JSON.parse(el.textContent); }
      catch(e){ STATE = defaultState(); }
    }
    STATE = normalizeState(STATE);
  }

  /* ---------- render: shell ---------- */
  function render(){
    var app = document.getElementById("app");
    if (!app) return;

    if (!session){
      app.innerHTML = renderLogin();
      return;
    }

    var isAdmin = session.role === "admin";
    var syncState = isReadOnly ? "readonly" : (hasSync ? "live" : "local");
    var syncLabel = isReadOnly ? "읽기 전용" : (hasSync ? "실시간 동기화" : "이 브라우저에만 저장");
    var whoLabel = isAdmin ? (session.name + " (" + (session.adminType === "production" ? "생산관리자" : "전체관리자") + ")") : session.name;

    var content = "";
    if (activeTab === "settings" && isAdmin) content = renderSettings();
    else if (activeTab === "report" && isAdmin) content = renderReport();
    else if (activeTab === "in") content = renderForm("in");
    else if (activeTab === "out") content = renderForm("out");
    else if (activeTab === "history") content = renderHistory();
    else if (isAdmin) content = renderDashboard();
    else content = renderForm("in");

  /* ---------- render: tx row ---------- */
  var HISTORY_PILL = { in: "입고", out: "출고", produced: "재생" };

    html += '<span class="tx-qty ' + (isPlus?"in":"out") + ' num">' + (isPlus?"+":"-") + fmtNum(t.qty) + '개</span></div>';

      html += '<div class="tx-meta">' + fmtDate(t.date) + '</div>';
    } else {
      html += '<div class="tx-meta">' + fmtDate(t.date) + ' · ' + esc(t.party || "-") + ' · ' + esc(t.handler || "-") + '</div>';

        html += '<div class="tx-meta">재생 <b class="num">' + fmtNum(t.goodQty) + '개</b> · 고철 <b class="num">' + fmtNum(t.qty - t.goodQty) + '개</b></div>';
      }
    }
    if (t.adminType){
      html += '<div class="tx-meta">' + (t.adminType === "production" ? "생산관리자" : "전체관리자") + ' 등록</div>';

      html += '<button type="button" class="tx-del' + pendingCls + '" data-action="deleteTx" data-id="' + t.id + '">' + (pendingDeleteTx === t.id ? "정말?" : "삭제") + '</button>';
    }

  /* ---------- render: history ---------- */
  function renderHistory(){
    var isAdmin = session && session.role === "admin";
    var html = "";
    html += '<div class="filter-row">';
    html += '<div class="seg">';
    var filters = [["all","전체"],["in","입고"],["out","출고"]];
    if (isAdmin) filters.push(["produced","재생"]);
    filters.forEach(function(f){
      html += '<button type="button" class="' + (historyFilterType===f[0]?"active":"") + '" data-action="setHistoryType" data-value="' + f[0] + '">' + f[1] + '</button>';
    });

    STATE.drumTypes.forEach(function(dt){
      html += '<option value="' + dt.id + '"' + (historyFilterDrum===dt.id?" selected":"") + '>' + esc(dt.name) + '</option>';
    });
    html += '</select>';
    html += '</div>';

    var restrictToOwn = session && session.role === "driver";
    var allowedTypes = isAdmin ? ["in","out","produced"] : ["in","out"];
    var list = STATE.transactions.filter(function(t){
      if (allowedTypes.indexOf(t.type) === -1) return false;
      if (restrictToOwn){
        // Match records logged through this driver's own login (driverId),
        // and also older/admin-entered records where only the 담당자 name
        // was recorded (no driverId yet) — so nothing they own goes missing.
        var byId = t.driverId && t.driverId === session.driverId;
        var byName = !t.driverId && t.handler === session.name;
        if (!byId && !byName) return false;
      }
      if (historyFilterType !== "all" && t.type !== historyFilterType) return false;
      if (historyFilterDrum !== "all" && t.drumTypeId !== historyFilterDrum) return false;
      return true;
    }).sort(function(a,b){ return b.ts - a.ts; });

    if (list.length === 0){
      html += '<div class="empty">' + (restrictToOwn ? "아직 등록한 기록이 없어요." : "조건에 맞는 기록이 없어요.") + '</div>';
    } else {
      list.forEach(function(t){ html += renderTxRow(t, true); });
    }
    return html;
  }

  /* ---------- render: daily report ---------- */
  function computeDailySummary(date){
    return STATE.drumTypes.map(function(dt){
      var inQty = 0, outQty = 0, producedQty = 0;
      STATE.transactions.forEach(function(t){
        if (t.date !== date || t.drumTypeId !== dt.id) return;
        if (t.type === "in") inQty += t.qty;
        else if (t.type === "out") outQty += t.qty;
        else if (t.type === "produced") producedQty += t.qty;
      });
      // 재고를 실제로 늘리는 건 재생 처리뿐이라, 그날의 순증감도 입고가
      // 아니라 재생 기준으로 계산한다 (입고는 참고용으로 별도 표시).
      return { id: dt.id, name: dt.name, in: inQty, out: outQty, produced: producedQty, net: producedQty - outQty };
    });
  }

  // groups a day's transactions by 업체명 (party), each with its own line
  // items (drum type, qty, handler) and an in/out/total for that company.
  function computePartySummary(date){
    var order = [];
    var byName = {};
    STATE.transactions.forEach(function(t){
      if (t.date !== date || (t.type !== "in" && t.type !== "out")) return;
      var key = t.party || "(미지정)";
      if (!byName[key]){ byName[key] = { name: key, in: 0, out: 0, items: [] }; order.push(key); }
      byName[key][t.type] += t.qty;
      byName[key].items.push(t);
    });
    return order.map(function(key){
      var g = byName[key];
      g.items.sort(function(a,b){ return a.ts - b.ts; });
      return { name: g.name, in: g.in, out: g.out, total: g.in + g.out, items: g.items };
    }).sort(function(a,b){ return b.total - a.total; });
  }

  function renderReport(){
    var summary = computeDailySummary(reportDate);
    var totalIn = summary.reduce(function(s,r){ return s + r.in; }, 0);
    var totalOut = summary.reduce(function(s,r){ return s + r.out; }, 0);
    var totalProduced = summary.reduce(function(s,r){ return s + r.produced; }, 0);
    var partyGroups = computePartySummary(reportDate);
    var hasPartyActivity = partyGroups.length > 0;
    var hasProducedActivity = STATE.transactions.some(function(t){ return t.type === "produced" && t.date === reportDate; });
    var hasActivity = hasPartyActivity || hasProducedActivity;

    var html = "";
    html += '<div class="section-title">일일 입출고 현황</div>';
    html += '<div class="field"><label for="f-reportDate">날짜</label>';
    html += '<input class="input" id="f-reportDate" type="date" data-field="reportDate" value="' + esc(reportDate) + '"></div>';

    html += '<div class="summary-card" style="margin-top:14px">';
    html += '<div><div class="label">' + fmtDate(reportDate) + ' 입고</div><div class="value num">' + fmtNum(totalIn) + '<small>개</small></div></div>';
    html += '<div class="meta">재생 <b class="num">' + fmtNum(totalProduced) + '</b>개 · 출고 <b class="num">' + fmtNum(totalOut) + '</b>개</div>';
    html += '</div>';

    html += '<button type="button" class="btn primary" data-action="downloadExcel" style="margin-top:14px"' + (hasActivity ? "" : " disabled") + '>엑셀로 다운로드</button>';

    html += '<div class="section-title">업체별 현황</div>';
    if (!hasPartyActivity){
      html += '<div class="empty">이 날짜에 등록된 입출고 기록이 없어요.</div>';
    } else {
      partyGroups.forEach(function(g){
        html += '<div class="party-card">';
        html += '<div class="party-card-head"><span class="party-card-name">' + esc(g.name) + '</span>';
        html += '<span class="party-card-total num">합계 ' + fmtNum(g.total) + '개</span></div>';
        html += '<div class="report-table-wrap"><table class="report-table"><thead><tr><th>구분</th><th>드럼 종류</th><th>수량</th><th>재생/고철</th><th>담당자</th></tr></thead><tbody>';
        g.items.forEach(function(t){
          var isIn = t.type === "in";
          var hasSplit = isIn && !t.decoupled && t.goodQty != null && t.goodQty !== t.qty;
          html += '<tr><td>' + (isIn ? "입고" : "출고") + '</td><td>' + esc(drumName(t.drumTypeId)) + '</td>';
          html += '<td class="num ' + (isIn?"in":"out") + '">' + (isIn?"+":"-") + fmtNum(t.qty) + '</td>';
          html += '<td class="num">' + (hasSplit ? (fmtNum(t.goodQty) + ' / ' + fmtNum(t.qty - t.goodQty)) : "-") + '</td>';
          html += '<td>' + esc(t.handler || "-") + '</td></tr>';
        });
        html += '</tbody></table></div>';
        html += '</div>';
      });
    }

    html += '<div class="section-title">종류별 현황</div>';
    if (!hasActivity){
      html += '<div class="empty">이 날짜에 등록된 입출고 기록이 없어요.</div>';
    } else {
      html += '<div class="report-table-wrap"><table class="report-table"><thead><tr><th>드럼 종류</th><th>입고</th><th>재생</th><th>출고</th><th>순증감</th></tr></thead><tbody>';
      summary.forEach(function(r){
        html += '<tr><td>' + esc(r.name) + '</td>';
        html += '<td class="num in">' + (r.in ? "+" + fmtNum(r.in) : "-") + '</td>';
        html += '<td class="num in">' + (r.produced ? "+" + fmtNum(r.produced) : "-") + '</td>';
        html += '<td class="num out">' + (r.out ? "-" + fmtNum(r.out) : "-") + '</td>';
        html += '<td class="num">' + (r.net > 0 ? "+" : "") + fmtNum(r.net) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    return html;
  }

  function downloadExcel(){
    if (typeof XLSX === "undefined"){
      showToast("엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요.");
      return;
    }
    var date = reportDate;
    var partyGroups = computePartySummary(date);

    var partyRows = [["업체명", "입고", "출고", "합계"]];
    partyGroups.forEach(function(g){ partyRows.push([g.name, g.in, g.out, g.total]); });

    var detailRows = [["업체명", "구분", "드럼 종류", "수량", "재생드럼", "고철드럼", "담당자", "비고"]];
    partyGroups.forEach(function(g){
      g.items.forEach(function(t){
        var isIn = t.type === "in";
        var hasSplit = isIn && !t.decoupled && t.goodQty != null && t.goodQty !== t.qty;
        detailRows.push([
          g.name, isIn ? "입고" : "출고",
          drumName(t.drumTypeId), t.qty,
          hasSplit ? t.goodQty : "", hasSplit ? (t.qty - t.goodQty) : "",
          t.handler || "", t.note || ""
        ]);
      });
    });

    var summary = computeDailySummary(date);
    var summaryRows = [["드럼 종류", "입고", "재생", "출고", "순증감"]];
    summary.forEach(function(r){ summaryRows.push([r.name, r.in, r.produced, r.out, r.net]); });

    var producedRows = [["드럼 종류", "재생 수량", "등록 유형", "비고"]];
    STATE.transactions.forEach(function(t){
      if (t.type !== "produced" || t.date !== date) return;
      producedRows.push([
        drumName(t.drumTypeId), t.qty,
        t.adminType === "production" ? "생산관리자" : "전체관리자",
        t.note || ""
      ]);
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(partyRows), "업체별 요약");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detailRows), "상세");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "종류별 요약");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(producedRows), "재생 상세");
    XLSX.writeFile(wb, "공드럼_입출고_" + date + ".xlsx");
  }

  /* ---------- render: in form (checkbox list, one row per drum type) ---------- */
  function renderInForm(){
    var d = formDrafts["in"];
    ensureInChecks(d);
    var err = formErrors["in"] || { checks: {}, otherCheck: {}, produced: {} };
    var isAdmin = session && session.role === "admin";

    var html = "";
    if (isAdmin && STATE.drumTypes.length > 0){
      var totalBacklogAll = 0;
      STATE.drumTypes.forEach(function(dt){ totalBacklogAll += computeScrapStock(STATE, dt.id); });
      html += '<div class="summary-card">';
      html += '<div><div class="label">재생·매각·폐기 대기 물량</div><div class="value num">' + fmtNum(totalBacklogAll) + '<small>개</small></div></div>';
      html += '<div class="meta">' + STATE.drumTypes.length + '종</div>';
      html += '</div>';
    }
    html += '<form data-form="in" data-action-submit="in">';
    html += '<div class="section-title">공드럼 입고 등록</div>';

    if (STATE.drumTypes.length === 0 && !d.otherChecked){
      html += '<div class="empty">먼저 드럼 종류를 등록해주세요.<br><a href="#" class="cta" data-action="switchTab" data-tab="settings">드럼 종류 추가하기 →</a></div>';
      return html + "</form>";
    }

    html += field("date","날짜","date", d.date || todayStr(), err.date);

    html += '<div class="field"><label>드럼 종류별 입고수량</label></div>';

    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id] || { checked: false, qty: "" };
      var cErr = (err.checks && err.checks[dt.id]) || {};
      html += '<div class="check-row' + (c.checked?" checked":"") + '">';
      html += '<label class="check-row-head"><input type="checkbox" data-field="checkToggle" data-id="' + dt.id + '"' + (c.checked?" checked":"") + '><span>' + esc(dt.name) + '</span></label>';
      if (c.checked){
        html += '<div class="check-row-fields">';
        html += '<div class="field' + (cErr.qty?" has-err":"") + '">';
        html += '<label>입고수량</label>';
        html += '<div class="qty-wrap"><input class="input" type="number" inputmode="numeric" min="1" step="1" placeholder="0" data-field="checkQty" data-id="' + dt.id + '" value="' + esc(c.qty) + '"><span class="unit">개</span></div>';
        if (cErr.qty) html += '<div class="err">' + esc(cErr.qty) + '</div>';
        html += '</div>';
        html += '</div>';
      }
      html += '</div>';

  /* ---------- render: registration result ---------- */
  var RESULT_PILL = { in: "입고", out: "출고", sold: "매각", disposed: "폐기", produced: "재생 생산" };

  function renderResult(kind){
    var r = lastResult[kind];
    if (!r) return "";
    var isIn = kind === "in";
    var html = "";
    html += '<div class="section-title">' + (isIn?"입고 등록 완료":"출고 등록 완료") + '</div>';
    html += '<div class="result-meta">' + fmtDate(r.date) + ' · ' + esc(r.partyName || "-") + ' · ' + esc(r.handlerName || "-") + '</div>';
    if (isIn && r.adminType){
      html += '<div class="result-meta">' + (r.adminType === "production" ? "생산관리자" : "전체관리자") + ' 등록</div>';
    }
    if (r.note) html += '<div class="tx-note" style="margin-bottom:10px">' + esc(r.note) + '</div>';
    r.items.forEach(function(it){
      var txType = it.txType || (isIn ? "in" : "out");
      var isPlus = txType === "in" || txType === "produced";
      html += '<div class="tx-row">';
      html += '<span class="pill ' + (isPlus?"in":"out") + '">' + RESULT_PILL[txType] + '</span>';
      html += '<div class="tx-main"><div class="tx-top"><span class="tx-drum">' + esc(it.name) + '</span>';
      html += '<span class="tx-qty ' + (isPlus?"in":"out") + ' num">' + (isPlus?"+":"-") + fmtNum(it.qty) + '개</span></div>';
      html += '</div>';
      html += '</div>';
    });
    html += '<button type="button" class="btn primary" data-action="startNewEntry" data-kind="' + kind + '" style="margin-top:16px">새로 등록하기</button>';
    html += '<button type="button" class="btn ghost" data-action="switchTab" data-tab="history" style="margin-top:8px">등록 내역 보기</button>';
    return html;
  }

  function field(name,label,type,value,error,placeholder){
    var html = '<div class="field' + (error?" has-err":"") + '">';
    html += '<label for="f-' + name + '">' + esc(label) + '</label>';
    html += '<input class="input" id="f-' + name + '" type="' + type + '" data-field="' + name + '" value="' + esc(value) + '"' + (placeholder?(' placeholder="'+esc(placeholder)+'"'):"") + '>';
    if (error) html += '<div class="err">' + esc(error) + '</div>';
    return html + '</div>';
  }

  function renderPartySection(kind, title, addPlaceholder, inUseTitle){
    var key = partiesKey(kind);
    var list = STATE[key];
    var html = '<div class="section-title">' + esc(title) + '</div>';
    if (list.length === 0){
      html += '<div class="empty">등록된 항목이 없어요. 아래에서 추가해주세요.<br>추가하기 전에는 입고·출고 등록 시 "기타"로만 입력할 수 있어요.</div>';
    } else {
      list.forEach(function(p){
        var inUse = partyInUse(STATE, kind, p.id);
        var pendingCls = pendingDeleteParty[kind] === p.id ? " pending" : "";
        html += '<div class="type-row">';
        if (editingPartyId[kind] === p.id){
          html += '<input class="input" style="flex:1" data-field="editParty" data-kind="' + kind + '" value="' + esc(editingPartyValue[kind]) + '">';
          html += '<button type="button" data-action="savePartyEdit" data-kind="' + kind + '" data-id="' + p.id + '">저장</button>';
          html += '<button type="button" data-action="cancelPartyEdit" data-kind="' + kind + '">취소</button>';
        } else {
          html += '<span class="tname">' + esc(p.name) + '</span>';
          if (inUse) html += '<span class="tcount">사용 중</span>';
          html += '<button type="button" data-action="startPartyEdit" data-kind="' + kind + '" data-id="' + p.id + '" aria-label="이름 수정">수정</button>';
          html += '<button type="button" class="del' + pendingCls + '" data-action="deleteParty" data-kind="' + kind + '" data-id="' + p.id + '"' + (inUse?(' disabled title="'+esc(inUseTitle)+'"'):"") + '>' + (pendingDeleteParty[kind]===p.id ? "정말?" : "삭제") + '</button>';
        }
        html += '</div>';
      });
    }
    html += '<div class="add-type-row" data-form="_addParty">';
    html += '<input class="input" placeholder="' + esc(addPlaceholder) + '" data-field="addParty" data-kind="' + kind + '" value="' + esc(formDrafts.addParty[kind]) + '">';
    html += '<button type="button" class="btn primary small" data-action="addParty" data-kind="' + kind + '">추가</button>';
    html += '</div>';
    if (formErrors.addParty[kind]) html += '<div class="err" style="margin-top:6px">' + esc(formErrors.addParty[kind]) + '</div>';
    return html;

          html += '<input class="input" style="flex:1;min-width:90px" placeholder="아이디" data-field="editAdminUsername" value="' + esc(editingAdminUsername) + '">';

      });

    html += '<div class="add-type-row" style="flex-wrap:wrap" data-form="addAdmin">';

    html += '<option value="production"' + (formDrafts.addAdmin.type==="production"?" selected":"") + '>생산관리자</option>';
    html += '<option value="general"' + (formDrafts.addAdmin.type==="general"?" selected":"") + '>전체관리자</option>';
    html += '</select>';
    html += '<button type="button" class="btn primary small" data-action="addAdmin">추가</button>';

    if (isReadOnly) html += '<div class="hint" style="margin-top:14px">읽기 전용 보기에서는 변경할 수 없어요.</div>';
    return html;
  }

  /* ---------- actions ---------- */
  function allowedTabs(){
    return session && session.role === "admin" ? ADMIN_TABS : DRIVER_TABS;
  }
  function switchTab(tab){
    if (!session) return;
    if (allowedTabs().indexOf(tab) === -1) return;
    activeTab = tab;
    if (tab === "in" || tab === "out") formView[tab] = "form";
    pendingDeleteTx = null;
    pendingDeleteType = null;
    pendingDeleteDriver = null;
    pendingDeleteParty = { "in": null, "out": null };
    editingTypeId = null;
    editingDriverId = null;
    editingPartyId = { "in": null, "out": null };
    render();
  }

  function loginUnified(){
    var d = formDrafts.login;
    var username = (d.username || "").trim();
    var password = d.password || "";
    if (!username || !password){
      loginError = "아이디와 비밀번호를 입력해주세요";
      render();
      return;
    }
    var usernameLower = username.toLowerCase();
    var driver = STATE.drivers.filter(function(x){ return x.username.toLowerCase() === usernameLower; })[0];
    if (driver){
      if (driver.password !== password){
        loginError = "아이디 또는 비밀번호가 맞지 않아요";
        render();
        return;
      }
      loginError = "";
      session = { role:"driver", driverId: driver.id, name: driver.name };
      ls_set(SESSION_KEY, JSON.stringify(session));
      formDrafts.login = { username:"", password:"" };
      activeTab = "in";
      render();
      return;
    }
    var admin = STATE.admins.filter(function(x){ return x.username.toLowerCase() === usernameLower; })[0];
    if (admin){
      if (admin.password !== password){
        loginError = "아이디 또는 비밀번호가 맞지 않아요";
        render();
        return;
      }
      loginError = "";
      session = { role:"admin", adminType: admin.type, adminId: admin.id, name: admin.name };
      ls_set(SESSION_KEY, JSON.stringify(session));
      formDrafts.login = { username:"", password:"" };
      activeTab = "dashboard";
      render();
      return;
    }
    loginError = "아이디 또는 비밀번호가 맞지 않아요";
    render();
  }

  function logout(){
    session = null;
    ls_del(SESSION_KEY);
    activeTab = "dashboard";
    loginError = "";
    formView = { "in": "form", "out": "form" };
    lastResult = { "in": null, "out": null };
    historyFilterType = "all";
    render();
  }

  function setHistoryType(v){ historyFilterType = v; render(); }
  function setHistoryDrum(v){ historyFilterDrum = v; render(); }

  // resolves an item's chosen drum type against a (possibly already-extended)
  // drumTypes list; returns { id, drumTypes } where drumTypes includes a newly
  // created entry when the typed name didn't already exist.
  function resolveDrumType(item, drumTypes){
    if (item.drumTypeId !== OTHER_DRUM_ID) return { id: item.drumTypeId, drumTypes: drumTypes };
    var typeName = (item.drumTypeOther || "").trim();
    var match = drumTypes.filter(function(t){ return t.name === typeName; })[0];
    if (match) return { id: match.id, drumTypes: drumTypes };
    var newType = { id: genId(), name: typeName };
    return { id: newType.id, drumTypes: drumTypes.concat([newType]) };
  }

  function outEntryHasErrors(errors){
    if (errors.date || errors.partyId || errors.party || errors.handler || errors.noneChecked) return true;
    if (errors.checks && Object.keys(errors.checks).some(function(id){ return errors.checks[id] && Object.keys(errors.checks[id]).length > 0; })) return true;
    if (errors.otherCheck && Object.keys(errors.otherCheck).length > 0) return true;
    if (errors.scrapSold && Object.keys(errors.scrapSold).some(function(id){ return errors.scrapSold[id] && Object.keys(errors.scrapSold[id]).length > 0; })) return true;
    if (errors.scrapDisposed && Object.keys(errors.scrapDisposed).some(function(id){ return errors.scrapDisposed[id] && Object.keys(errors.scrapDisposed[id]).length > 0; })) return true;
    return false;
  }

  function validateOutEntry(d){
    var errors = { checks: {}, otherCheck: {}, scrapSold: {}, scrapDisposed: {} };
    if (!d.date) errors.date = "날짜를 선택해주세요";

    var stock = computeStock(STATE);
    var isAdmin = session && session.role === "admin";
    var anyOutChecked = false;
    var anyScrapChecked = false;

    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id];
      if (!c || !c.checked) return;
      anyOutChecked = true;
      var cErr = {};
      var qty = parseInt(c.qty, 10);
      if (!qty || qty <= 0) cErr.qty = "수량을 입력해주세요";
      else {
        var avail = stock[dt.id] || 0;
        if (qty > avail) cErr.qty = "재고보다 많아요 (현재 " + fmtNum(avail) + "개)";
      }
      if (Object.keys(cErr).length) errors.checks[dt.id] = cErr;
    });

    if (d.otherChecked){
      anyOutChecked = true;
      var oErr = {};
      if (!d.otherName || !d.otherName.trim()) oErr.name = "드럼 종류를 입력해주세요";
      var oQty = parseInt(d.otherQty, 10);
      if (!oQty || oQty <= 0) oErr.qty = "수량을 입력해주세요";
      else {
        var existingType = STATE.drumTypes.filter(function(t){ return t.name === (d.otherName || "").trim(); })[0];
        var avail = existingType ? (stock[existingType.id] || 0) : 0;
        if (oQty > avail) oErr.qty = "재고보다 많아요 (현재 " + fmtNum(avail) + "개)";
      }
      if (Object.keys(oErr).length) errors.otherCheck = oErr;
    }

    // 매각/폐기는 관리자만 등록할 수 있어요 (기사님은 해당 체크박스 자체를 볼 수 없어요).
    if (isAdmin){
      STATE.drumTypes.forEach(function(dt){
        var scrapAvail = computeScrapStock(STATE, dt.id);
        var used = 0;
        var sc = d.scrapSold[dt.id];
        var dc = d.scrapDisposed[dt.id];
        var sErr = {}, dErr = {};
        if (sc && sc.checked){
          anyScrapChecked = true;
          var sQty = parseInt(sc.qty, 10);
          if (!sQty || sQty <= 0) sErr.qty = "수량을 입력해주세요";
          else used += sQty;
        }
        if (dc && dc.checked){
          anyScrapChecked = true;
          var dQty = parseInt(dc.qty, 10);
          if (!dQty || dQty <= 0) dErr.qty = "수량을 입력해주세요";
          else used += dQty;
        }
        if (used > scrapAvail){
          var msg = "고철 재고보다 많아요 (현재 " + fmtNum(scrapAvail) + "개)";
          if (sc && sc.checked && !sErr.qty) sErr.qty = msg;
          if (dc && dc.checked && !dErr.qty) dErr.qty = msg;
        }
        if (Object.keys(sErr).length) errors.scrapSold[dt.id] = sErr;
        if (Object.keys(dErr).length) errors.scrapDisposed[dt.id] = dErr;
      });
    }

    if (!anyOutChecked && !anyScrapChecked) errors.noneChecked = "출고하거나 매각·폐기할 드럼 종류를 하나 이상 선택해주세요";

    // 용도/출고처·담당자는 실제 출고 항목이 있을 때만 필요해요. 매각·폐기만
    // 등록할 때는 (예전 고철 탭처럼) 필요 없어요.
    if (anyOutChecked){
      if (!d.partyId) errors.partyId = "용도나 출고처를 선택해주세요";
      else if (d.partyId === OTHER_PARTY_ID && (!d.party || !d.party.trim())) errors.party = "용도나 출고처를 입력해주세요";
      var isDriver = session && session.role === "driver";
      if (!isDriver && (!d.handler || !d.handler.trim())) errors.handler = "담당자를 입력해주세요";
    }
    return errors;
  }

  function submitOutEntry(){
    if (!session || isReadOnly || submitting["out"]) return;
    var d = formDrafts["out"];
    ensureOutChecks(d);
    if (!d.date) d.date = todayStr();
    var errors = validateOutEntry(d);
    formErrors["out"] = errors;
    if (outEntryHasErrors(errors)){ render(); return; }

    var isDriver = session.role === "driver";
    var isAdmin = session.role === "admin";
    var anyOutChecked = d.otherChecked || STATE.drumTypes.some(function(dt){
      var c = d.checks[dt.id];
      return c && c.checked;
    });

    var handlerName = isDriver ? session.name : (d.handler || "").trim();
    var partyId, partyName;
    if (d.partyId === OTHER_PARTY_ID){
      partyId = null;
      partyName = (d.party || "").trim();
    } else {
      var pMatch = STATE.outParties.filter(function(p){ return p.id === d.partyId; })[0];
      partyId = d.partyId || null;
      partyName = pMatch ? pMatch.name : "";
    }

    var newDrumTypes = STATE.drumTypes;
    var resultItems = [];
    var txs = [];
    var ts0 = Date.now();
    var seq = 0;
    var note = (d.note || "").trim();

    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id];
      if (!c || !c.checked) return;
      var qty = parseInt(c.qty, 10);
      resultItems.push({ name: dt.name, qty: qty, goodQty: null, txType: "out" });
      txs.push({
        id: genId(), type: "out", date: d.date, drumTypeId: dt.id,
        qty: qty, party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        note: note, ts: ts0 + (seq++)
      });
    });

    if (d.otherChecked){
      var resolved = resolveDrumType({ drumTypeId: OTHER_DRUM_ID, drumTypeOther: d.otherName }, newDrumTypes);
      newDrumTypes = resolved.drumTypes;
      var oQty = parseInt(d.otherQty, 10);
      var dtObj = newDrumTypes.filter(function(t){ return t.id === resolved.id; })[0];
      resultItems.push({ name: dtObj ? dtObj.name : "", qty: oQty, goodQty: null, txType: "out" });
      txs.push({
        id: genId(), type: "out", date: d.date, drumTypeId: resolved.id,
        qty: oQty, party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        note: note, ts: ts0 + (seq++)
      });
    }

    // 매각·폐기는 관리자 전용 (기사님 화면에는 해당 체크박스가 아예 없어요).
    if (isAdmin){
      STATE.drumTypes.forEach(function(dt){
        var sc = d.scrapSold[dt.id];
        if (sc && sc.checked){
          var sQty = parseInt(sc.qty, 10);
          resultItems.push({ name: dt.name, qty: sQty, goodQty: null, txType: "sold" });
          txs.push({ id: genId(), type: "sold", date: d.date, drumTypeId: dt.id, qty: sQty, note: note, ts: ts0 + (seq++) });
        }
        var dc = d.scrapDisposed[dt.id];
        if (dc && dc.checked){
          var dQty = parseInt(dc.qty, 10);
          resultItems.push({ name: dt.name, qty: dQty, goodQty: null, txType: "disposed" });
          txs.push({ id: genId(), type: "disposed", date: d.date, drumTypeId: dt.id, qty: dQty, note: note, ts: ts0 + (seq++) });
        }
      });
    }

    var newState = Object.assign({}, STATE, { drumTypes: newDrumTypes, transactions: STATE.transactions.concat(txs) });
    if (anyOutChecked && !isDriver) saveLastHandler(handlerName);

    var hasScrapTx = txs.some(function(t){ return t.type === "sold" || t.type === "disposed"; });
    var flashMsg = anyOutChecked
      ? (hasScrapTx ? "출고와 매각·폐기를 등록했어요" : "출고를 등록했어요")
      : "매각·폐기를 등록했어요";

    submitting["out"] = true; render();
    publishState(newState, { flash: flashMsg, keepTab: "out" }).then(function(res){
      submitting["out"] = false;
      if (res.ok){
        lastResult["out"] = {
          date: d.date, partyName: partyName, handlerName: handlerName,
          note: note, items: resultItems
        };
        formView["out"] = "result";
        formDrafts["out"] = {
          date: todayStr(), checks: {},
          otherChecked: false, otherName: "", otherQty: "",
          scrapSold: {}, scrapDisposed: {},
          partyId: d.partyId, party: (d.partyId === OTHER_PARTY_ID ? "" : d.party),
          handler: d.handler, note: ""
        };
        ensureOutChecks(formDrafts["out"]);
        formErrors["out"] = { checks: {}, otherCheck: {}, scrapSold: {}, scrapDisposed: {} };
        ss_set(DRAFT_KEY, JSON.stringify(formDrafts));
        render();
      } else {
        render();
      }
    });
  }

  function inEntryHasErrors(errors){
    if (errors.date || errors.partyId || errors.party || errors.handler || errors.noneChecked) return true;
    if (errors.checks && Object.keys(errors.checks).some(function(id){ return errors.checks[id] && Object.keys(errors.checks[id]).length > 0; })) return true;
    if (errors.otherCheck && Object.keys(errors.otherCheck).length > 0) return true;
    if (errors.produced && Object.keys(errors.produced).some(function(id){ return errors.produced[id] && Object.keys(errors.produced[id]).length > 0; })) return true;
    return false;
  }

  function validateInEntry(d){
    var errors = { checks: {}, otherCheck: {}, produced: {} };
    if (!d.date) errors.date = "날짜를 선택해주세요";

    var isAdmin = session && session.role === "admin";
    var anyIn = false;
    var anyProduced = false;

    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id];
      if (!c || !c.checked) return;
      anyIn = true;
      var cErr = {};
      var qty = parseInt(c.qty, 10);
      if (!qty || qty <= 0) cErr.qty = "수량을 입력해주세요";
      if (Object.keys(cErr).length) errors.checks[dt.id] = cErr;
    });

    if (d.otherChecked){
      anyIn = true;
      var oErr = {};
      if (!d.otherName || !d.otherName.trim()) oErr.name = "드럼 종류를 입력해주세요";
      var oQty = parseInt(d.otherQty, 10);
      if (!oQty || oQty <= 0) oErr.qty = "수량을 입력해주세요";
      if (Object.keys(oErr).length) errors.otherCheck = oErr;
    }

    // 하루 재생 드럼 수량은 입고수량과 완전히 별도의 체크리스트라, 그날
    // 입고를 체크하지 않은 종류도 재생 처리량만 독립적으로 등록할 수 있다.
    // 다만 재생·매각·폐기 대기 물량(계산상 같은 풀)을 넘어설 수는 없다.
    if (isAdmin){
      STATE.drumTypes.forEach(function(dt){
        var p = d.produced[dt.id];
        if (!p || !p.checked) return;
        anyProduced = true;
        var pErr = {};
        var pQty = parseInt(p.qty, 10);
        if (!pQty || pQty <= 0) pErr.qty = "수량을 입력해주세요";
        else {
          var backlog = computeScrapStock(STATE, dt.id);
          if (pQty > backlog) pErr.qty = "재생·매각·폐기 대기 물량보다 많아요 (현재 " + fmtNum(backlog) + "개)";
        }
        if (Object.keys(pErr).length) errors.produced[dt.id] = pErr;
      });
    }

    if (!anyIn && !anyProduced) errors.noneChecked = "입고하거나 재생 처리할 드럼 종류를 하나 이상 선택해주세요";

    // 공급처·담당자는 실제 입고 항목이 있을 때만 필요하다. 재생 수량만
    // 등록할 때는 (매각·폐기와 마찬가지로) 필요 없다.
    if (anyIn){
      if (!d.partyId) errors.partyId = "공급처를 선택해주세요";
      else if (d.partyId === OTHER_PARTY_ID && (!d.party || !d.party.trim())) errors.party = "공급처를 입력해주세요";
      var isDriver = session && session.role === "driver";
      if (!isDriver && (!d.handler || !d.handler.trim())) errors.handler = "담당자를 입력해주세요";
    }
    return errors;
  }

  function submitInEntry(){
    if (!session || isReadOnly || submitting["in"]) return;
    var d = formDrafts["in"];
    ensureInChecks(d);
    if (!d.date) d.date = todayStr();
    var errors = validateInEntry(d);
    formErrors["in"] = errors;
    if (inEntryHasErrors(errors)){ render(); return; }

    var isDriver = session.role === "driver";
    var isAdmin = session.role === "admin";
    var anyIn = d.otherChecked || STATE.drumTypes.some(function(dt){
      var c = d.checks[dt.id];
      return c && c.checked;
    });

    var handlerName = isDriver ? session.name : (d.handler || "").trim();
    var partyId, partyName;
    if (d.partyId === OTHER_PARTY_ID){
      partyId = null;
      partyName = (d.party || "").trim();
    } else {
      var pMatch = STATE.inParties.filter(function(p){ return p.id === d.partyId; })[0];
      partyId = d.partyId || null;
      partyName = pMatch ? pMatch.name : "";
    }

    var newDrumTypes = STATE.drumTypes;
    var resultItems = [];
    var txs = [];
    var ts0 = Date.now();
    var seq = 0;
    var note = (d.note || "").trim();

    // 드럼 종류별 입고수량: 재생 처리는 이제 별도 체크리스트에서 하므로,
    // 여기서 등록되는 수량은 곧바로 재고가 되지 않고 재생·매각·폐기
    // 대기 물량으로 쌓인다 (기사님은 예전처럼 전량 재고로 들어감).
    STATE.drumTypes.forEach(function(dt){
      var c = d.checks[dt.id];
      if (!c || !c.checked) return;
      var qty = parseInt(c.qty, 10);
      var goodQty = isDriver ? qty : 0;
      resultItems.push({ name: dt.name, qty: qty, txType: "in" });
      txs.push({
        id: genId(), type: "in", date: d.date, drumTypeId: dt.id,
        qty: qty, goodQty: goodQty, decoupled: true,
        party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        adminType: isAdmin ? session.adminType : null,
        note: note, ts: ts0 + (seq++)
      });
    });

    if (d.otherChecked){
      var resolved = resolveDrumType({ drumTypeId: OTHER_DRUM_ID, drumTypeOther: d.otherName }, newDrumTypes);
      newDrumTypes = resolved.drumTypes;
      var oQty = parseInt(d.otherQty, 10);
      var oGood = isDriver ? oQty : 0;
      var dtObj = newDrumTypes.filter(function(t){ return t.id === resolved.id; })[0];
      resultItems.push({ name: dtObj ? dtObj.name : "", qty: oQty, txType: "in" });
      txs.push({
        id: genId(), type: "in", date: d.date, drumTypeId: resolved.id,
        qty: oQty, goodQty: oGood, decoupled: true,
        party: partyName, partyId: partyId, handler: handlerName,
        driverId: isDriver ? session.driverId : null,
        adminType: isAdmin ? session.adminType : null,
        note: note, ts: ts0 + (seq++)
      });
    }

    // 하루 재생 드럼 수량: 관리자 전용, 입고 체크와 완전히 독립적으로
    // 등록되는 실제 재고 증가 처리 실적.
    if (isAdmin){
      STATE.drumTypes.forEach(function(dt){
        var p = d.produced[dt.id];
        if (!p || !p.checked) return;
        var pQty = parseInt(p.qty, 10);
        resultItems.push({ name: dt.name, qty: pQty, txType: "produced" });
        txs.push({
          id: genId(), type: "produced", date: d.date, drumTypeId: dt.id,
          qty: pQty, adminType: session.adminType, note: note, ts: ts0 + (seq++)
        });
      });
    }

    var newState = Object.assign({}, STATE, { drumTypes: newDrumTypes, transactions: STATE.transactions.concat(txs) });
    if (anyIn && !isDriver) saveLastHandler(handlerName);

    var hasProducedTx = txs.some(function(t){ return t.type === "produced"; });
    var flashMsg = anyIn
      ? (hasProducedTx ? "입고와 재생 생산량을 등록했어요" : "입고를 등록했어요")
      : "재생 생산량을 등록했어요";

    submitting["in"] = true; render();
    publishState(newState, { flash: flashMsg, keepTab: "in" }).then(function(res){
      submitting["in"] = false;
      if (res.ok){
        lastResult["in"] = {
          date: d.date, partyName: partyName, handlerName: handlerName,
          adminType: isAdmin ? session.adminType : null,
          note: note, items: resultItems
        };
        formView["in"] = "result";
        formDrafts["in"] = {
          date: todayStr(), checks: {}, produced: {},
          otherChecked: false, otherName: "", otherQty: "",
          partyId: d.partyId, party: (d.partyId === OTHER_PARTY_ID ? "" : d.party),
          handler: d.handler, note: ""
        };
        ensureInChecks(formDrafts["in"]);
        formErrors["in"] = { checks: {}, otherCheck: {}, produced: {} };
        ss_set(DRAFT_KEY, JSON.stringify(formDrafts));
        render();
      } else {
        render();
      }
    });
  }

  /* ---------- event delegation ---------- */
  function onClick(e){
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;
    if (action === "switchTab"){ e.preventDefault(); switchTab(t.dataset.tab); }
    else if (action === "setHistoryType"){ setHistoryType(t.dataset.value); }
    else if (action === "deleteTx"){ deleteTx(t.dataset.id); }
    else if (action === "addType"){ addType(); }
    else if (action === "startTypeEdit"){ startTypeEdit(t.dataset.id); }
    else if (action === "cancelTypeEdit"){ cancelTypeEdit(); }
    else if (action === "saveTypeEdit"){ saveTypeEdit(t.dataset.id); }
    else if (action === "deleteType"){ if (!t.disabled) deleteType(t.dataset.id); }
    else if (action === "addParty"){ addParty(t.dataset.kind); }
    else if (action === "startPartyEdit"){ startPartyEdit(t.dataset.kind, t.dataset.id); }
    else if (action === "cancelPartyEdit"){ cancelPartyEdit(t.dataset.kind); }
    else if (action === "savePartyEdit"){ savePartyEdit(t.dataset.kind, t.dataset.id); }
    else if (action === "deleteParty"){ if (!t.disabled) deleteParty(t.dataset.kind, t.dataset.id); }
    else if (action === "logout"){ logout(); }
    else if (action === "addDriver"){ addDriver(); }
    else if (action === "startDriverEdit"){ startDriverEdit(t.dataset.id); }
    else if (action === "cancelDriverEdit"){ cancelDriverEdit(); }
    else if (action === "saveDriverEdit"){ saveDriverEdit(t.dataset.id); }
    else if (action === "deleteDriver"){ deleteDriver(t.dataset.id); }
    else if (action === "addAdmin"){ addAdmin(); }
    else if (action === "startAdminEdit"){ startAdminEdit(t.dataset.id); }
    else if (action === "cancelAdminEdit"){ cancelAdminEdit(); }
    else if (action === "saveAdminEdit"){ saveAdminEdit(t.dataset.id); }
    else if (action === "deleteAdmin"){ if (!t.disabled) deleteAdmin(t.dataset.id); }
    else if (action === "startNewEntry"){ startNewEntry(t.dataset.kind); }
    else if (action === "downloadExcel"){ downloadExcel(); }
  }
  function onSubmit(e){
    var f = e.target.closest("form[data-action-submit]");
    if (!f) return;
    e.preventDefault();
    var kind = f.dataset.actionSubmit;
    if (kind === "loginUnified"){ loginUnified(); }
    else if (kind === "in"){ submitInEntry(); }
    else if (kind === "out"){ submitOutEntry(); }
  }
  function onInput(e){
    var el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    if (el.dataset.field === "checkToggle" || el.dataset.field === "otherToggle" || el.dataset.field === "producedToggle") return; // handled in onChange
    if (el.dataset.field === "checkQty"){
      var checkForm = el.closest("[data-form]");
      var checkKind = checkForm && formDrafts[checkForm.dataset.form] ? checkForm.dataset.form : "in";
      var checkId = el.dataset.id;
      var dCheck = formDrafts[checkKind];
      if (!dCheck.checks[checkId]) dCheck.checks[checkId] = { checked: false, qty: "" };
      dCheck.checks[checkId].qty = el.value;
      scheduleDraftSave();
      return;
    }
    if (el.dataset.field === "producedQty"){
      var producedId = el.dataset.id;
      if (!formDrafts["in"].produced[producedId]) formDrafts["in"].produced[producedId] = { checked: false, qty: "" };
      formDrafts["in"].produced[producedId].qty = el.value;
      scheduleDraftSave();
      return;
    }
    if (el.dataset.field === "otherName" || el.dataset.field === "otherQty"){
      var otherForm = el.closest("[data-form]");
      var otherKind = otherForm && formDrafts[otherForm.dataset.form] ? otherForm.dataset.form : "in";
      formDrafts[otherKind][el.dataset.field] = el.value;
      scheduleDraftSave();
      return;
    }
    if (el.dataset.field === "reportDate"){ reportDate = el.value; render(); return; }
    if (el.dataset.field === "scrapSoldQty" || el.dataset.field === "scrapDisposedQty"){
      var scrapId = el.dataset.id;
      var bucket = el.dataset.field === "scrapSoldQty" ? formDrafts["out"].scrapSold : formDrafts["out"].scrapDisposed;
      if (!bucket[scrapId]) bucket[scrapId] = { checked: false, qty: "" };
      bucket[scrapId].qty = el.value;
      scheduleDraftSave();
      return;
    }
    if (el.dataset.field === "editType"){ editingTypeValue = el.value; return; }
    if (el.dataset.field === "addType"){ formDrafts.addType = el.value; scheduleDraftSave(); return; }
    if (el.dataset.field === "editParty"){ editingPartyValue[el.dataset.kind] = el.value; return; }
    if (el.dataset.field === "addParty"){ formDrafts.addParty[el.dataset.kind] = el.value; scheduleDraftSave(); return; }
    if (el.dataset.field === "editDriverName"){ editingDriverName = el.value; return; }
    if (el.dataset.field === "editDriverUsername"){ editingDriverUsername = el.value; return; }
    if (el.dataset.field === "editDriverPassword"){ editingDriverPassword = el.value; return; }
    if (el.dataset.field === "editAdminName"){ editingAdminName = el.value; return; }
    if (el.dataset.field === "editAdminUsername"){ editingAdminUsername = el.value; return; }
    if (el.dataset.field === "editAdminPassword"){ editingAdminPassword = el.value; return; }
    if (el.dataset.field === "editAdminType"){ editingAdminType = el.value; return; }
    var form = el.closest("[data-form]");
    if (form){
      var kind = form.dataset.form;
      if (kind === "_addType" || kind === "_addParty") return; // already handled above by field name
      if (formDrafts[kind]) formDrafts[kind][el.dataset.field] = el.value;
      // login / new-account fields hold credentials: keep them in memory
      // only, never mirrored into sessionStorage.
      if (kind !== "login" && kind !== "addDriver" && kind !== "addAdmin"){
        scheduleDraftSave();
      }
    }
  }
  function onChange(e){
    var el = e.target;
    if (el.dataset && el.dataset.action === "setHistoryDrum"){ setHistoryDrum(el.value); return; }
    if (el.dataset && el.dataset.field === "checkToggle"){
      var toggleForm = el.closest("[data-form]");
      var toggleKind = toggleForm && formDrafts[toggleForm.dataset.form] ? toggleForm.dataset.form : "in";
      var checkId = el.dataset.id;
      var dToggle = formDrafts[toggleKind];
      if (toggleKind === "in") ensureInChecks(dToggle); else ensureOutChecks(dToggle);
      if (!dToggle.checks[checkId]) dToggle.checks[checkId] = { checked: false, qty: "" };
      dToggle.checks[checkId].checked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    if (el.dataset && el.dataset.field === "otherToggle"){
      var otherToggleForm = el.closest("[data-form]");
      var otherToggleKind = otherToggleForm && formDrafts[otherToggleForm.dataset.form] ? otherToggleForm.dataset.form : "in";
      formDrafts[otherToggleKind].otherChecked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    if (el.dataset && el.dataset.field === "producedToggle"){
      var producedId = el.dataset.id;
      ensureInChecks(formDrafts["in"]);
      if (!formDrafts["in"].produced[producedId]) formDrafts["in"].produced[producedId] = { checked: false, qty: "" };
      formDrafts["in"].produced[producedId].checked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    if (el.dataset && el.dataset.field === "scrapSoldToggle"){
      var soldId = el.dataset.id;
      ensureOutChecks(formDrafts["out"]);
      if (!formDrafts["out"].scrapSold[soldId]) formDrafts["out"].scrapSold[soldId] = { checked: false, qty: "" };
      formDrafts["out"].scrapSold[soldId].checked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    if (el.dataset && el.dataset.field === "scrapDisposedToggle"){
      var disposedId = el.dataset.id;
      ensureOutChecks(formDrafts["out"]);
      if (!formDrafts["out"].scrapDisposed[disposedId]) formDrafts["out"].scrapDisposed[disposedId] = { checked: false, qty: "" };
      formDrafts["out"].scrapDisposed[disposedId].checked = el.checked;
      scheduleDraftSave();
      render();
      return;
    }
    onInput(e);
    if (el.dataset && (el.dataset.field === "partyId" || el.dataset.field === "checkQty" || el.dataset.field === "otherQty" || el.dataset.field === "producedQty" || el.dataset.field === "scrapSoldQty" || el.dataset.field === "scrapDisposedQty")){ render(); }
  }

  /* ---------- init ---------- */
  function restoreSession(){
    var raw = ls_get(SESSION_KEY);
    if (!raw) return;
    try {
      var s = JSON.parse(raw);
      var admin = s && s.role === "admin" && s.adminId ? STATE.admins.filter(function(a){ return a.id === s.adminId; })[0] : null;
      var driver = s && s.role === "driver" && s.driverId ? STATE.drivers.filter(function(d){ return d.id === s.driverId; })[0] : null;
      if (admin){
        session = { role: "admin", adminType: admin.type, adminId: admin.id, name: admin.name };
      } else if (driver){
        session = { role: "driver", driverId: driver.id, name: driver.name };
      } else {
        ls_del(SESSION_KEY);
      }
    } catch(e){ ls_del(SESSION_KEY); }
  }

  function init(){
    loadStateFromDOM();
    restoreSession();
    restoreDrafts();
    if (!formDrafts["in"].handler) formDrafts["in"].handler = lastHandler();
    if (!formDrafts["out"].handler) formDrafts["out"].handler = lastHandler();
    if (!formDrafts["in"].date) formDrafts["in"].date = todayStr();
    if (!formDrafts["out"].date) formDrafts["out"].date = todayStr();

    var flash = ss_get(FLASH_KEY);
    if (flash) ss_del(FLASH_KEY);
    var nextTab = ss_get(TAB_KEY);
    if (nextTab){ ss_del(TAB_KEY); activeTab = nextTab; }
    else if (session){ activeTab = session.role === "admin" ? "dashboard" : "in"; }
    if (session && allowedTabs().indexOf(activeTab) === -1){
      activeTab = session.role === "admin" ? "dashboard" : "in";
    }

    var app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("submit", onSubmit);
    app.addEventListener("input", onInput);
    app.addEventListener("change", onChange);

    render();
    if (flash) showToast(flash);

    if (window.claude && typeof window.claude.use === "function"){
      window.claude.use("artifact").then(function(ns){
        artifact = ns;
        hasSync = !!ns;
        syncMode = hasSync ? "claude" : "local";
        render();
      }).catch(function(){ hasSync = false; syncMode = "local"; render(); });
    } else if (window.__gongdrumFirebaseReady){
      window.__gongdrumFirebaseReady.then(function(api){
        firebaseApi = api;
        hasSync = true;
        syncMode = "firebase";
        var firstSnapshot = true;
        api.subscribe(function(remote){
          if (remote){
            STATE = normalizeState(remote);
          } else if (firstSnapshot){
            firebaseApi.publish(STATE);
          }
          firstSnapshot = false;
          render();
        });
      }).catch(function(){ hasSync = false; syncMode = "local"; render(); });
    } else {
      hasSync = false;
      syncMode = "local";
      render();
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
