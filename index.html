<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>공드럼 입출고 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="app-style">
  :root{
    --bg:#eef1f3;
    --surface:#ffffff;
    --surface-2:#e7ebee;
    --border:#dbe1e6;
    --ink:#182530;
    --ink-muted:#5c6b78;
    --ink-faint:#8b98a3;
    --accent:#245e8c;
    --accent-ink:#ffffff;
    --accent-soft:#e2eefa;
    --in-color:#1f8a4c;
    --in-soft:#e3f5ea;
    --out-color:#b1590f;
    --out-soft:#faeade;
    --danger:#c62828;
    --danger-soft:#fbe6e6;
    --shadow:0 1px 2px rgba(20,30,40,.06), 0 6px 16px -8px rgba(20,30,40,.12);
    --radius:12px;
    --radius-sm:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161c;
      --surface:#1a2229;
      --surface-2:#212b33;
      --border:#2c3844;
      --ink:#eef2f5;
      --ink-muted:#9aa8b3;
      --ink-faint:#6d7a85;
      --accent:#6badde;
      --accent-ink:#0d1a24;
      --accent-soft:#1c2e3d;
      --in-color:#4fce88;
      --in-soft:#173627;
      --out-color:#f0a355;
      --out-soft:#3a2b1a;
      --danger:#f38b8b;
      --danger-soft:#3a1f1f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161c;
    --surface:#1a2229;
    --surface-2:#212b33;
    --border:#2c3844;
    --ink:#eef2f5;
    --ink-muted:#9aa8b3;
    --ink-faint:#6d7a85;
    --accent:#6badde;
    --accent-ink:#0d1a24;
    --accent-soft:#1c2e3d;
    --in-color:#4fce88;
    --in-soft:#173627;
    --out-color:#f0a355;
    --out-soft:#3a2b1a;
    --danger:#f38b8b;
    --danger-soft:#3a1f1f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}

  a{color:var(--accent);}

  .app-header{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .app-header-inner{
    max-width:640px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .brand-mark{color:var(--accent);flex:none;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-title{font-weight:900;font-size:16px;letter-spacing:-.01em;}
  .brand-sub{font-size:11.5px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-faint);}
  .sync-dot[data-state="live"]{background:var(--in-color);}
  .sync-dot[data-state="local"]{background:var(--out-color);}
  .sync-dot[data-state="readonly"]{background:var(--danger);}
  .icon-btn{
    flex:none;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn:active{transform:translateY(1px);}

  .app-main{
    flex:1;
    max-width:640px;width:100%;margin:0 auto;
    padding:16px 16px 100px;
  }

  .banner{
    display:flex;align-items:flex-start;gap:8px;
    background:var(--danger-soft);color:var(--danger);
    border:1px solid var(--danger);
    border-radius:var(--radius-sm);
    padding:10px 12px;font-size:13.5px;line-height:1.5;
    margin-bottom:14px;
  }
  .banner.warn{background:var(--out-soft);color:var(--out-color);border-color:var(--out-color);}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-muted);margin:22px 0 10px;letter-spacing:.02em;}
  .section-title:first-child{margin-top:0;}

  .stock-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  }
  .stock-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);
    border-left:3px solid var(--accent);
    display:flex;flex-direction:column;gap:4px;
  }
  .stock-card .name{font-size:12.5px;color:var(--ink-muted);font-weight:500;line-height:1.3;}
  .stock-card .qty{font-size:26px;font-weight:700;line-height:1.1;}
  .stock-card .qty small{font-size:13px;font-weight:500;color:var(--ink-muted);margin-left:2px;}

  .summary-card{
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 78%, black));
    color:var(--accent-ink);
    border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:16px;
  }
  .summary-card .label{font-size:12.5px;opacity:.85;font-weight:500;}
  .summary-card .value{font-size:34px;font-weight:700;line-height:1;margin-top:4px;}
  .summary-card .value small{font-size:15px;font-weight:500;opacity:.85;margin-left:3px;}
  .summary-card .meta{font-size:12px;opacity:.85;text-align:right;}

  .empty{
    text-align:center;color:var(--ink-muted);font-size:13.5px;
    padding:36px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty a.cta{display:inline-block;margin-top:10px;font-weight:700;}

  .tx-row{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;box-shadow:var(--shadow);
  }
  .pill{
    flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .pill.in{background:var(--in-soft);color:var(--in-color);}
  .pill.out{background:var(--out-soft);color:var(--out-color);}
  .tx-main{flex:1;min-width:0;}
  .tx-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .tx-drum{font-weight:700;font-size:14px;}
  .tx-qty{font-weight:700;font-size:14px;}
  .tx-qty.in{color:var(--in-color);}
  .tx-qty.out{color:var(--out-color);}
  .tx-meta{font-size:12px;color:var(--ink-muted);margin-top:3px;line-height:1.5;}
  .tx-note{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .tx-del{
    flex:none;border:none;background:transparent;color:var(--ink-faint);
    font-size:12px;padding:6px 4px;cursor:pointer;border-radius:6px;
  }
  .tx-del:hover{color:var(--danger);}
  .tx-del.pending{color:var(--danger);font-weight:700;background:var(--danger-soft);padding:6px 8px;}

  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;}
  .seg button{
    border:none;background:transparent;padding:7px 13px;border-radius:999px;font-size:12.5px;
    font-weight:700;color:var(--ink-muted);cursor:pointer;
  }
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  select.filter-select{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;
  }

  form{display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-muted);}
  .field .hint{font-size:11.5px;color:var(--ink-faint);}
  .field .err{font-size:12px;color:var(--danger);font-weight:500;}
  .input, select.input, textarea.input{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:var(--radius-sm);padding:11px 12px;font-size:15.5px;width:100%;
  }
  .input:focus, select.input:focus, textarea.input:focus{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  .field.has-err .input{border-color:var(--danger);}
  textarea.input{resize:vertical;min-height:64px;}
  .qty-wrap{position:relative;}
  .qty-wrap .unit{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    color:var(--ink-muted);font-size:13.5px;pointer-events:none;
  }
  .qty-wrap input{padding-right:34px;}

  .btn{
    border:none;border-radius:var(--radius-sm);padding:13px 18px;font-size:15px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    transition:opacity .15s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.in-btn{background:var(--in-color);color:#08240f;}
  .btn.out-btn{background:var(--out-color);color:#2a1400;}
  .btn.ghost{background:var(--surface-2);color:var(--ink);}
  .btn.danger-ghost{background:var(--danger-soft);color:var(--danger);}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;}

  .stock-hint{font-size:12px;color:var(--ink-muted);margin-top:-2px;}
  .stock-hint b{color:var(--ink);}

  .type-row{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:8px;
  }
  .type-row .tname{flex:1;font-size:14px;font-weight:500;}
  .type-row .tcount{font-size:11.5px;color:var(--ink-faint);}
  .type-row button{border:none;background:transparent;color:var(--ink-muted);cursor:pointer;padding:6px;border-radius:6px;font-size:12px;}
  .type-row button:hover{color:var(--accent);background:var(--surface-2);}
  .type-row button.del:hover{color:var(--danger);}
  .type-row button.del.pending{color:var(--danger);font-weight:700;background:var(--danger-soft);}
  .type-row button:disabled{opacity:.35;cursor:not-allowed;}
  .type-row.editing{align-items:center;}
  .add-type-row{display:flex;gap:8px;margin-top:12px;}
  .add-type-row input{flex:1;}

  .app-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app-nav-inner{
    max-width:640px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);
  }
  .nav-btn{
    border:none;background:transparent;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 8px;cursor:pointer;font-size:10.5px;font-weight:700;
    border-top:2px solid transparent;
  }
  .nav-btn.active{color:var(--accent);border-top-color:var(--accent);}
  .nav-btn svg{width:21px;height:21px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 22px;text-align:center;}
  .login-mark{color:var(--accent);display:flex;justify-content:center;margin-bottom:10px;}
  .login-title{font-weight:900;font-size:19px;letter-spacing:-.01em;}
  .login-sub{font-size:12.5px;color:var(--ink-muted);margin-top:4px;margin-bottom:18px;}
  .login-seg{justify-content:center;margin-bottom:18px;}
  .login-seg button{flex:1;}
  .login-form{text-align:left;margin-top:4px;}
  .login-form .err{text-align:left;}

  .toast{
    position:fixed;left:50%;bottom:86px;transform:translate(-50%,12px);
    background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:50;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (min-width:640px){
    .stock-grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function genId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function todayStr(){
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tz).toISOString().slice(0,10);
  }
  function fmtDate(s){
    if (!s) return "";
    var p = s.split("-");
    if (p.length !== 3) return s;
    return p[0] + "." + p[1] + "." + p[2];
  }
  function fmtNum(n){
    n = Number(n) || 0;
    return n.toLocaleString("ko-KR");
  }
  function drumName(id){
    var t = STATE.drumTypes.filter(function(x){ return x.id === id; })[0];
    return t ? t.name : "(삭제된 종류)";
  }
  function computeStock(state){
    var stock = {};
    state.drumTypes.forEach(function(dt){ stock[dt.id] = 0; });
    state.transactions.forEach(function(t){
      if (!(t.drumTypeId in stock)) stock[t.drumTypeId] = 0;
      stock[t.drumTypeId] += (t.type === "in" ? t.qty : -t.qty);
    });
    return stock;
  }
  function typeInUse(state, id){
    return state.transactions.some(function(t){ return t.drumTypeId === id; });
  }
  function partyInUse(state, id){
    return state.transactions.some(function(t){ return t.partyId === id; });
  }

  /* ---------- persistence helpers (per-viewer, not shared) ---------- */
  function ss_get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function ss_set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
  function ss_del(k){ try { sessionStorage.removeItem(k); } catch(e){} }
  function ls_get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function ls_set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  function ls_del(k){ try { localStorage.removeItem(k); } catch(e){} }

  function scheduleDraftSave(){
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(function(){
      ss_set(DRAFT_KEY, JSON.stringify(formDrafts));
    }, 400);
  }
  function restoreDrafts(){
    var raw = ss_get(DRAFT_KEY);
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d && d["in"]) formDrafts["in"] = Object.assign(formDrafts["in"], d["in"]);
      if (d && d["out"]) formDrafts["out"] = Object.assign(formDrafts["out"], d["out"]);
      if (d && typeof d.addType === "string") formDrafts.addType = d.addType;
      if (d && typeof d.addParty === "string") formDrafts.addParty = d.addParty;
    } catch(e){}
  }
  function saveLastHandler(name){
    if (name) ls_set(HANDLER_KEY, name);
  }
  function lastHandler(){
    return ls_get(HANDLER_KEY) || "";
  }

  /* ---------- toast / banner ---------- */
  var bannerMsg = "";
  function showToast(msg){
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3200);
  }
  function showBanner(msg){
    bannerMsg = msg;
    render();
    setTimeout(function(){ if (bannerMsg === msg){ bannerMsg = ""; render(); } }, 6000);
  }

  /* ---------- publish (sync to every viewer) ---------- */
  function buildFullHTML(state){
    var css = document.getElementById("app-style").textContent;
    var scriptSrc = document.getElementById("app-script").textContent;
    var stateJson = JSON.stringify(state).replace(/</g, "\\u003c");
    var html = "";
    html += "<!doctype html>\n<html lang=\"ko\">\n<head>\n";
    html += "<meta charset=\"utf-8\">\n";
    html += "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n";
    html += "<meta name=\"color-scheme\" content=\"light dark\">\n";
    html += "<title>공드럼 입출고 관리</title>\n";
    html += "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n";
    html += "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n";
    html += "<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n";
    html += "<style id=\"app-style\">" + css + "</style>\n";
    html += "</head>\n<body>\n";
    html += "<div id=\"app\"></div>\n<div id=\"toast\" class=\"toast\" aria-live=\"polite\"></div>\n";
    html += "<script type=\"application/json\" id=\"state-data\">" + stateJson + "<\/script>\n";
    html += "<script id=\"app-script\">" + scriptSrc + "<\/script>\n";
    html += "</body>\n</html>";
    return html;
  }

  function publishState(newState, opts){
    opts = opts || {};
    if (!hasSync){
      STATE = newState;
      ls_set(STATE_KEY, JSON.stringify(newState));
      render();
      if (opts.flash) showToast(opts.flash + " · 이 기기에 저장돼요");
      return Promise.resolve({ ok:true, local:true });
    }
    if (opts.flash) ss_set(FLASH_KEY, opts.flash);
    if (opts.keepTab) ss_set(TAB_KEY, opts.keepTab);
    return artifact.publish(buildFullHTML(newState)).then(function(){
      return { ok:true };
    }, function(err){
      ss_del(FLASH_KEY);
      ss_del(TAB_KEY);
      var code = err && err.code;
      if (code === "conflict"){
        showBanner("다른 사람이 방금 저장했어요. 화면이 곧 새로고침돼요. 입력한 내용은 남아있어요.");
      } else if (code === "not_writer" || code === "not_granted"){
        isReadOnly = true;
        showBanner("읽기 전용 보기라 저장할 수 없어요.");
      } else if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        hasSync = false;
        showBanner("실시간 동기화를 사용할 수 없어요. 이 기기에 저장돼요.");
        STATE = newState;
        ls_set(STATE_KEY, JSON.stringify(newState));
        render();
        return { ok:true, local:true };
      } else {
        showBanner((err && err.message) || "저장에 실패했어요. 다시 시도해주세요.");
      }
      return { ok:false, code: code };
    });
  }

  /* ---------- default state ---------- */
  function defaultState(){
    return {
      drumTypes: [
        { id:"dt1", name:"200L 철드럼" },
        { id:"dt2", name:"200L 플라스틱드럼" },
        { id:"dt3", name:"60L 철드럼" },
        { id:"dt4", name:"20L 철드럼" },
        { id:"dt5", name:"20L 페일(플라스틱)" }
      ],
      transactions: [],
      drivers: [],
      parties: [],
      adminPassword: "admin1234"
    };
  }
  function loadStateFromDOM(){
    var saved = ls_get(STATE_KEY);
    if (saved){
      try { STATE = JSON.parse(saved); } catch(e){ STATE = null; }
    }
    if (!STATE){
      var el = document.getElementById("state-data");
      try { STATE = JSON.parse(el.textContent); }
      catch(e){ STATE = defaultState(); }
    }
    if (!STATE || !Array.isArray(STATE.drumTypes)) STATE = defaultState();
    if (!Array.isArray(STATE.drivers)) STATE.drivers = [];
    if (!Array.isArray(STATE.parties)) STATE.parties = [];
    if (typeof STATE.adminPassword !== "string" || !STATE.adminPassword) STATE.adminPassword = "admin1234";
  }

  /* ---------- render: shell ---------- */
  function render(){
    var app = document.getElementById("app");
    if (!app) return;

    if (!session){
      app.innerHTML = renderLogin();
      return;
    }

    var isAdmin = session.role === "admin";
    var syncState = isReadOnly ? "readonly" : (hasSync ? "live" : "local");
    var syncLabel = isReadOnly ? "읽기 전용" : (hasSync ? "실시간 동기화" : "이 브라우저에만 저장");
    var whoLabel = isAdmin ? "관리자" : session.name;

    var content = "";
    if (activeTab === "settings" && isAdmin) content = renderSettings();
    else if (activeTab === "in") content = renderForm("in");
    else if (activeTab === "out") content = renderForm("out");
    else if (activeTab === "history") content = renderHistory();
    else if (isAdmin) content = renderDashboard();
    else content = renderForm("in");

    var html = "";
    html += '<header class="app-header"><div class="app-header-inner">';
    html += '<div class="brand">';
    html += '<span class="brand-mark">' + iconWrap(ICONS.drum, 26) + '</span>';
    html += '<div class="brand-text"><span class="brand-title">공드럼 입출고</span>';
    html += '<span class="brand-sub"><span class="sync-dot" data-state="' + syncState + '"></span>' + esc(whoLabel) + ' · ' + esc(syncLabel) + '</span></div>';
    html += '</div>';
    html += '<button type="button" class="icon-btn" data-action="logout" aria-label="로그아웃" title="로그아웃">' + iconWrap(ICONS.logout, 18) + '</button>';
    if (isAdmin && activeTab !== "settings") html += '<button type="button" class="icon-btn" data-action="switchTab" data-tab="settings" aria-label="설정" title="드럼·기사 설정">' + iconWrap(ICONS.settings, 19) + '</button>';
    html += '</div></header>';

    html += '<main class="app-main">';
    if (bannerMsg) html += '<div class="banner">' + iconWrap(ICONS.warn, 16) + '<span>' + esc(bannerMsg) + '</span></div>';
    html += content;
    html += '</main>';

    if (activeTab !== "settings"){
      var cols = isAdmin ? 4 : 3;
      html += '<nav class="app-nav"><div class="app-nav-inner" style="grid-template-columns:repeat(' + cols + ',1fr)">';
      if (isAdmin) html += navBtn("dashboard", ICONS.dashboard, "대시보드");
      html += navBtn("in", ICONS.inbox, "입고");
      html += navBtn("out", ICONS.outbox, "출고");
      html += navBtn("history", ICONS.history, isAdmin ? "이력" : "내 기록");
      html += '</div></nav>';
    }

    app.innerHTML = html;
  }

  /* ---------- render: login ---------- */
  function renderLogin(){
    var html = '<div class="login-wrap"><div class="login-card">';
    html += '<div class="login-mark">' + iconWrap(ICONS.drum, 38) + '</div>';
    html += '<div class="login-title">공드럼 입출고</div>';
    html += '<div class="login-sub">로그인하고 시작하세요</div>';
    html += '<div class="seg login-seg">';
    html += '<button type="button" class="' + (loginMode==="driver"?"active":"") + '" data-action="setLoginMode" data-value="driver">기사 로그인</button>';
    html += '<button type="button" class="' + (loginMode==="admin"?"active":"") + '" data-action="setLoginMode" data-value="admin">관리자 로그인</button>';
    html += '</div>';
    if (loginError) html += '<div class="err" style="text-align:center;margin-bottom:10px">' + esc(loginError) + '</div>';

    if (loginMode === "driver"){
      if (STATE.drivers.length === 0){
        html += '<div class="empty">등록된 기사님이 없어요.<br>관리자에게 등록을 요청해주세요.</div>';
      } else {
        html += '<form class="login-form" data-form="login" data-action-submit="loginDriver">';
        html += '<div class="field"><label for="f-driverId">이름</label>';
        html += '<select class="input" id="f-driverId" data-field="driverId">';
        html += '<option value="">선택해주세요</option>';
        STATE.drivers.forEach(function(dr){
          var sel = formDrafts.login.driverId === dr.id ? " selected" : "";
          html += '<option value="' + dr.id + '"' + sel + '>' + esc(dr.name) + '</option>';
        });
        html += '</select></div>';
        html += '<div class="field"><label for="f-pin">PIN 번호</label>';
        html += '<input class="input" id="f-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" data-field="pin" value="' + esc(formDrafts.login.pin) + '"></div>';
        html += '<button type="submit" class="btn primary">로그인</button>';
        html += '</form>';
      }
    } else {
      html += '<form class="login-form" data-form="login" data-action-submit="loginAdmin">';
      html += '<div class="field"><label for="f-adminPw">관리자 비밀번호</label>';
      html += '<input class="input" id="f-adminPw" type="password" placeholder="비밀번호" data-field="adminPw" value="' + esc(formDrafts.login.adminPw) + '"></div>';
      html += '<button type="submit" class="btn primary">로그인</button>';
      html += '</form>';
    }

    html += '</div></div>';
    return html;
  }

  function iconWrap(svg, size){
    return svg.replace("<svg ", '<svg style="width:' + size + 'px;height:' + size + 'px;display:block" ');
  }
  function navBtn(tab, icon, label){
    var cls = "nav-btn" + (activeTab === tab ? " active" : "");
    return '<button type="button" class="' + cls + '" data-action="switchTab" data-tab="' + tab + '">' + iconWrap(icon,21) + '<span>' + label + '</span></button>';
  }

  /* ---------- render: dashboard ---------- */
  function renderDashboard(){
    var stock = computeStock(STATE);
    var total = 0;
    STATE.drumTypes.forEach(function(dt){ total += (stock[dt.id] || 0); });

    var html = "";
    html += '<div class="summary-card"><div><div class="label">전체 재고</div><div class="value num">' + fmtNum(total) + '<small>개</small></div></div>';
    html += '<div class="meta">' + STATE.drumTypes.length + '종 관리 중</div></div>';

    html += '<div class="section-title">종류별 재고</div>';
    if (STATE.drumTypes.length === 0){
      html += '<div class="empty">등록된 드럼 종류가 없어요.<br><a href="#" class="cta" data-action="switchTab" data-tab="settings">드럼 종류 추가하기 →</a></div>';
    } else {
      html += '<div class="stock-grid">';
      STATE.drumTypes.forEach(function(dt){
        html += '<div class="stock-card"><div class="name">' + esc(dt.name) + '</div><div class="qty num">' + fmtNum(stock[dt.id] || 0) + '<small>개</small></div></div>';
      });
      html += '</div>';
    }

    html += '<div class="section-title">최근 활동</div>';
    var recent = STATE.transactions.slice().sort(function(a,b){ return b.ts - a.ts; }).slice(0,6);
    if (recent.length === 0){
      html += '<div class="empty">아직 입출고 기록이 없어요.<br><a href="#" class="cta" data-action="switchTab" data-tab="in">첫 입고 등록하기 →</a></div>';
    } else {
      recent.forEach(function(t){ html += renderTxRow(t, false); });
    }
    return html;
  }

  /* ---------- render: tx row ---------- */
  function renderTxRow(t, withDelete){
    var isIn = t.type === "in";
    var pendingCls = pendingDeleteTx === t.id ? " pending" : "";
    var html = '<div class="tx-row">';
    html += '<span class="pill ' + (isIn?"in":"out") + '">' + (isIn ? "입고" : "출고") + '</span>';
    html += '<div class="tx-main">';
    html += '<div class="tx-top"><span class="tx-drum">' + esc(drumName(t.drumTypeId)) + '</span>';
    html += '<span class="tx-qty ' + (isIn?"in":"out") + ' num">' + (isIn?"+":"-") + fmtNum(t.qty) + '개</span></div>';
    html += '<div class="tx-meta">' + fmtDate(t.date) + ' · ' + esc(t.party || "-") + ' · ' + esc(t.handler || "-") + '</div>';
    if (t.note) html += '<div class="tx-note">' + esc(t.note) + '</div>';
    html += '</div>';
    if (withDelete && !isReadOnly){
      html += '<button type="button" class="tx-del' + pendingCls + '" data-action="deleteTx" data-id="' + t.id + '">' + (pendingDeleteTx === t.id ? "정말?" : "삭제") + '</button>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- render: history ---------- */
  function renderHistory(){
    var html = "";
    html += '<div class="filter-row">';
    html += '<div class="seg">';
    [["all","전체"],["in","입고"],["out","출고"]].forEach(function(f){
      html += '<button type="button" class="' + (historyFilterType===f[0]?"active":"") + '" data-action="setHistoryType" data-value="' + f[0] + '">' + f[1] + '</button>';
    });
    html += '</div>';
    html += '<select class="filter-select" data-action="setHistoryDrum">';
    html += '<option value="all"' + (historyFilterDrum==="all"?" selected":"") + '>전체 종류</option>';
    STATE.drumTypes.forEach(function(dt){
      html += '<option value="' + dt.id + '"' + (historyFilterDrum===dt.id?" selected":"") + '>' + esc(dt.name) + '</option>';
    });
    html += '</select>';
    html += '</div>';

    var restrictToOwn = session && session.role === "driver";
    var list = STATE.transactions.filter(function(t){
      if (restrictToOwn){
        // Match records logged through this driver's own login (driverId),
        // and also older/admin-entered records where only the 담당자 name
        // was recorded (no driverId yet) — so nothing they own goes missing.
        var byId = t.driverId && t.driverId === session.driverId;
        var byName = !t.driverId && t.handler === session.name;
        if (!byId && !byName) return false;
      }
      if (historyFilterType !== "all" && t.type !== historyFilterType) return false;
      if (historyFilterDrum !== "all" && t.drumTypeId !== historyFilterDrum) return false;
      return true;
    }).sort(function(a,b){ return b.ts - a.ts; });

    if (list.length === 0){
      html += '<div class="empty">' + (restrictToOwn ? "아직 등록한 기록이 없어요." : "조건에 맞는 기록이 없어요.") + '</div>';
    } else {
      list.forEach(function(t){ html += renderTxRow(t, true); });
    }
    return html;
  }

  /* ---------- render: in/out form ---------- */
  function renderForm(kind){
    var isIn = kind === "in";
    var d = formDrafts[kind];
    var err = formErrors[kind] || {};
    var stock = computeStock(STATE);
    var partyLabel = isIn ? "공급처" : "용도 / 출고처";
    var partyPh = isIn ? "예: 대성상사" : "예: 세척 후 재사용";
    var btnLabel = isIn ? "입고 등록" : "출고 등록";
    var btnCls = isIn ? "in-btn" : "out-btn";

    var html = '<form data-form="' + kind + '" data-action-submit="' + kind + '">';
    html += '<div class="section-title">' + (isIn?"공드럼 입고 등록":"공드럼 출고 등록") + '</div>';

    if (STATE.drumTypes.length === 0){
      html += '<div class="empty">먼저 드럼 종류를 등록해주세요.<br><a href="#" class="cta" data-action="switchTab" data-tab="settings">드럼 종류 추가하기 →</a></div>';
      return html + "</form>";
    }

    html += field("date","날짜","date", d.date || todayStr(), err.date);

    // drum type select
    html += '<div class="field' + (err.drumTypeId?" has-err":"") + '">';
    html += '<label for="f-drumType">드럼 종류</label>';
    html += '<select class="input" id="f-drumType" data-field="drumTypeId">';
    html += '<option value="">선택해주세요</option>';
    STATE.drumTypes.forEach(function(dt){
      var sel = d.drumTypeId === dt.id ? " selected" : "";
      html += '<option value="' + dt.id + '"' + sel + '>' + esc(dt.name) + '</option>';
    });
    html += '</select>';
    if (!isIn && d.drumTypeId){
      html += '<div class="stock-hint">현재 재고 <b class="num">' + fmtNum(stock[d.drumTypeId] || 0) + '개</b></div>';
    }
    if (err.drumTypeId) html += '<div class="err">' + esc(err.drumTypeId) + '</div>';
    html += '</div>';

    // qty
    html += '<div class="field' + (err.qty?" has-err":"") + '">';
    html += '<label for="f-qty">수량</label>';
    html += '<div class="qty-wrap"><input class="input" id="f-qty" type="number" inputmode="numeric" min="1" step="1" placeholder="0" data-field="qty" value="' + esc(d.qty) + '"><span class="unit">개</span></div>';
    if (err.qty) html += '<div class="err">' + esc(err.qty) + '</div>';
    html += '</div>';

    // party select
    html += '<div class="field' + (err.partyId?" has-err":"") + '">';
    html += '<label for="f-partyId">' + esc(partyLabel) + '</label>';
    html += '<select class="input" id="f-partyId" data-field="partyId">';
    html += '<option value="">선택해주세요</option>';
    STATE.parties.forEach(function(p){
      var sel = d.partyId === p.id ? " selected" : "";
      html += '<option value="' + p.id + '"' + sel + '>' + esc(p.name) + '</option>';
    });
    html += '<option value="' + OTHER_PARTY_ID + '"' + (d.partyId === OTHER_PARTY_ID ? " selected" : "") + '>기타 (직접 입력)</option>';
    html += '</select>';
    if (err.partyId) html += '<div class="err">' + esc(err.partyId) + '</div>';
    html += '</div>';
    if (d.partyId === OTHER_PARTY_ID){
      html += field("party", partyLabel + " 직접 입력", "text", d.party, err.party, partyPh);
    }
    if (session && session.role === "driver"){
      html += '<div class="stock-hint">담당자 <b>' + esc(session.name) + '</b> 님으로 등록돼요</div>';
    } else {
      html += field("handler", "담당자", "text", d.handler, err.handler, "이름을 입력해주세요");
    }

    html += '<div class="field"><label for="f-note">비고 (선택)</label>';
    html += '<textarea class="input" id="f-note" data-field="note" placeholder="메모가 있다면 남겨주세요">' + esc(d.note) + '</textarea></div>';

    html += '<button type="submit" class="btn ' + btnCls + '"' + (submitting[kind] || isReadOnly ? " disabled" : "") + '>' + (submitting[kind] ? "저장 중..." : btnLabel) + '</button>';
    if (isReadOnly) html += '<div class="hint" style="text-align:center">읽기 전용 보기에서는 등록할 수 없어요.</div>';
    html += '</form>';
    return html;
  }

  function field(name,label,type,value,error,placeholder){
    var html = '<div class="field' + (error?" has-err":"") + '">';
    html += '<label for="f-' + name + '">' + esc(label) + '</label>';
    html += '<input class="input" id="f-' + name + '" type="' + type + '" data-field="' + name + '" value="' + esc(value) + '"' + (placeholder?(' placeholder="'+esc(placeholder)+'"'):"") + '>';

  /* ---------- actions ---------- */
  function allowedTabs(){
    return session && session.role === "admin" ? ADMIN_TABS : DRIVER_TABS;
  }
  function switchTab(tab){
    if (!session) return;
    if (allowedTabs().indexOf(tab) === -1) return;
    activeTab = tab;
    pendingDeleteTx = null;
    pendingDeleteType = null;
    pendingDeleteDriver = null;
    pendingDeleteParty = null;
    editingTypeId = null;
    editingDriverId = null;
    editingPartyId = null;
    render();
  }

  function setLoginMode(v){
    loginMode = (v === "admin") ? "admin" : "driver";
    loginError = "";
    render();
  }

  function loginDriverSubmit(){
    var d = formDrafts.login;
    var driver = STATE.drivers.filter(function(x){ return x.id === d.driverId; })[0];
    if (!driver || !d.pin || driver.pin !== d.pin){
      loginError = "이름과 PIN을 다시 확인해주세요";
      render();
      return;
    }
    loginError = "";
    session = { role:"driver", driverId: driver.id, name: driver.name };
    ls_set(SESSION_KEY, JSON.stringify(session));
    formDrafts.login = { driverId:"", pin:"", adminPw:"" };
    activeTab = "in";
    render();
  }

  function loginAdminSubmit(){
    var d = formDrafts.login;
    if (!d.adminPw || d.adminPw !== STATE.adminPassword){
      loginError = "비밀번호가 맞지 않아요";
      render();
      return;
    }
    loginError = "";
    session = { role:"admin" };
    ls_set(SESSION_KEY, JSON.stringify(session));
    formDrafts.login = { driverId:"", pin:"", adminPw:"" };
    activeTab = "dashboard";
    render();
  }

  function logout(){
    session = null;
    ls_del(SESSION_KEY);
    activeTab = "dashboard";
    loginError = "";
    render();
  }

  function setHistoryType(v){ historyFilterType = v; render(); }
  function setHistoryDrum(v){ historyFilterDrum = v; render(); }

  function validateEntry(kind, d){
    var errors = {};
    if (!d.date) errors.date = "날짜를 선택해주세요";
    if (!d.drumTypeId) errors.drumTypeId = "드럼 종류를 선택해주세요";
    var qty = parseInt(d.qty, 10);
    if (!qty || qty <= 0) errors.qty = "수량을 입력해주세요";
    else if (kind === "out"){
      var stock = computeStock(STATE)[d.drumTypeId] || 0;
      if (qty > stock) errors.qty = "재고보다 많아요 (현재 " + fmtNum(stock) + "개)";
    }
    if (!d.partyId) errors.partyId = "공급처를 선택해주세요";
    else if (d.partyId === OTHER_PARTY_ID && (!d.party || !d.party.trim())) errors.party = kind === "in" ? "공급처를 입력해주세요" : "용도나 출고처를 입력해주세요";
    var isDriver = session && session.role === "driver";
    if (!isDriver && (!d.handler || !d.handler.trim())) errors.handler = "담당자를 입력해주세요";
    return errors;
  }

  function submitEntry(kind){
    if (!session || isReadOnly || submitting[kind]) return;
    var d = formDrafts[kind];
    if (!d.date) d.date = todayStr();
    var errors = validateEntry(kind, d);
    formErrors[kind] = errors;
    if (Object.keys(errors).length){ render(); return; }

    var isDriver = session.role === "driver";
    var qty = parseInt(d.qty, 10);
    var handlerName = isDriver ? session.name : d.handler.trim();
    var partyId, partyName;
    if (d.partyId === OTHER_PARTY_ID){
      partyId = null;
      partyName = d.party.trim();
    } else {
      var pMatch = STATE.parties.filter(function(p){ return p.id === d.partyId; })[0];
      partyId = d.partyId;
      partyName = pMatch ? pMatch.name : "";
    }
    var tx = {
      id: genId(), type: kind, date: d.date, drumTypeId: d.drumTypeId,
      qty: qty, party: partyName, partyId: partyId, handler: handlerName,
      driverId: isDriver ? session.driverId : null,
      note: (d.note || "").trim(), ts: Date.now()
    };
    var newState = Object.assign({}, STATE, { transactions: STATE.transactions.concat([tx]) });
    if (!isDriver) saveLastHandler(tx.handler);

    submitting[kind] = true; render();
    publishState(newState, { flash: (kind==="in"?"입고를 등록했어요":"출고를 등록했어요"), keepTab: kind }).then(function(res){
      submitting[kind] = false;
      if (res.ok){
        formDrafts[kind] = { date: todayStr(), drumTypeId: d.drumTypeId, qty: "", partyId: d.partyId, party: d.party, handler: d.handler, note: "" };
        formErrors[kind] = {};
        ss_set(DRAFT_KEY, JSON.stringify(formDrafts));
        if (res.local) render();
      } else {
        render();
      }
    });
  }

  function deleteTx(id){
    if (!session || isReadOnly) return;
    if (session.role === "driver"){
      var own = STATE.transactions.filter(function(t){ return t.id === id; })[0];
      var ownedById = own && own.driverId && own.driverId === session.driverId;
      var ownedByName = own && !own.driverId && own.handler === session.name;
      if (!own || (!ownedById && !ownedByName)) return;
    }
    if (pendingDeleteTx !== id){ pendingDeleteTx = id; render(); return; }
    pendingDeleteTx = null;
    var newState = Object.assign({}, STATE, { transactions: STATE.transactions.filter(function(t){ return t.id !== id; }) });
    publishState(newState, { flash: "기록을 삭제했어요" }).then(function(){ render(); });
  }

  function addType(){
    if (isReadOnly) return;
    var name = (formDrafts.addType || "").trim();
    if (!name){ formErrors.addType = "종류 이름을 입력해주세요"; render(); return; }
    if (STATE.drumTypes.some(function(t){ return t.name === name; })){
      formErrors.addType = "이미 있는 이름이에요";
      render();
      return;
    }
    formErrors.addType = "";
    var newType = { id: genId(), name: name };
    var newState = Object.assign({}, STATE, { drumTypes: STATE.drumTypes.concat([newType]) });
    formDrafts.addType = "";
    publishState(newState, { flash: "드럼 종류를 추가했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function startTypeEdit(id){
    var t = STATE.drumTypes.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    editingTypeId = id;
    editingTypeValue = t.name;
    render();
  }
  function cancelTypeEdit(){ editingTypeId = null; render(); }
  function saveTypeEdit(id){
    var name = (editingTypeValue || "").trim();
    if (!name) return;
    var newState = Object.assign({}, STATE, {
      drumTypes: STATE.drumTypes.map(function(t){ return t.id === id ? Object.assign({}, t, { name: name }) : t; })
    });
    editingTypeId = null;
    publishState(newState, { flash: "이름을 수정했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function deleteType(id){
    if (isReadOnly || typeInUse(STATE, id)) return;
    if (pendingDeleteType !== id){ pendingDeleteType = id; render(); return; }
    pendingDeleteType = null;
    var newState = Object.assign({}, STATE, { drumTypes: STATE.drumTypes.filter(function(t){ return t.id !== id; }) });
    publishState(newState, { flash: "드럼 종류를 삭제했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function startPartyEdit(id){

    if (!p) return;

    editingPartyValue = p.name;
    render();
  }
  function cancelPartyEdit(){ editingPartyId = null; render(); }
  function savePartyEdit(id){

    if (!name) return;
    var newState = Object.assign({}, STATE, {
      parties: STATE.parties.map(function(p){ return p.id === id ? Object.assign({}, p, { name: name }) : p; })
    });
    editingPartyId = null;
    publishState(newState, { flash: "공급처 이름을 수정했어요", keepTab: "settings" }).then(function(){ render(); });

  function deleteParty(id){
    if (isReadOnly || partyInUse(STATE, id)) return;
    if (pendingDeleteParty !== id){ pendingDeleteParty = id; render(); return; }
    pendingDeleteParty = null;
    var newState = Object.assign({}, STATE, { parties: STATE.parties.filter(function(p){ return p.id !== id; }) });
    publishState(newState, { flash: "공급처를 삭제했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function addDriver(){
    if (isReadOnly) return;
    var name = (formDrafts.addDriver.name || "").trim();
    var pin = (formDrafts.addDriver.pin || "").trim();
    var error = "";
    if (!name) error = "이름을 입력해주세요";
    else if (!/^\d{4}$/.test(pin)) error = "PIN은 숫자 4자리로 입력해주세요";
    else if (STATE.drivers.some(function(dr){ return dr.name === name; })) error = "이미 있는 이름이에요";
    if (error){ formErrors.addDriver = error; render(); return; }
    formErrors.addDriver = "";
    var newDriver = { id: genId(), name: name, pin: pin };
    var newState = Object.assign({}, STATE, { drivers: STATE.drivers.concat([newDriver]) });
    formDrafts.addDriver = { name:"", pin:"" };
    publishState(newState, { flash: "기사님을 등록했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function startDriverEdit(id){
    var dr = STATE.drivers.filter(function(x){ return x.id === id; })[0];
    if (!dr) return;
    editingDriverId = id;
    editingDriverName = dr.name;
    editingDriverPin = dr.pin;
    render();
  }
  function cancelDriverEdit(){ editingDriverId = null; render(); }
  function saveDriverEdit(id){
    var name = (editingDriverName || "").trim();
    var pin = (editingDriverPin || "").trim();
    if (!name || !/^\d{4}$/.test(pin)) return;
    var newState = Object.assign({}, STATE, {
      drivers: STATE.drivers.map(function(dr){ return dr.id === id ? Object.assign({}, dr, { name:name, pin:pin }) : dr; })
    });
    editingDriverId = null;
    publishState(newState, { flash: "기사 정보를 수정했어요", keepTab: "settings" }).then(function(){ render(); });
  }
  function deleteDriver(id){
    if (isReadOnly) return;
    if (pendingDeleteDriver !== id){ pendingDeleteDriver = id; render(); return; }
    pendingDeleteDriver = null;
    var newState = Object.assign({}, STATE, { drivers: STATE.drivers.filter(function(dr){ return dr.id !== id; }) });
    publishState(newState, { flash: "기사님을 삭제했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  function changeAdminPassword(){
    if (isReadOnly) return;
    var pw = (formDrafts.adminPw.value || "").trim();
    if (pw.length < 4){ formErrors.adminPw = "4자 이상 입력해주세요"; render(); return; }
    formErrors.adminPw = "";
    var newState = Object.assign({}, STATE, { adminPassword: pw });
    formDrafts.adminPw = { value:"" };
    publishState(newState, { flash: "관리자 비밀번호를 변경했어요", keepTab: "settings" }).then(function(){ render(); });
  }

  /* ---------- event delegation ---------- */
  function onClick(e){
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;
    if (action === "switchTab"){ e.preventDefault(); switchTab(t.dataset.tab); }
    else if (action === "setHistoryType"){ setHistoryType(t.dataset.value); }
    else if (action === "deleteTx"){ deleteTx(t.dataset.id); }
    else if (action === "addType"){ addType(); }
    else if (action === "startTypeEdit"){ startTypeEdit(t.dataset.id); }
    else if (action === "cancelTypeEdit"){ cancelTypeEdit(); }
    else if (action === "saveTypeEdit"){ saveTypeEdit(t.dataset.id); }
    else if (action === "deleteType"){ if (!t.disabled) deleteType(t.dataset.id); }
    else if (action === "addParty"){ addParty(); }
    else if (action === "startPartyEdit"){ startPartyEdit(t.dataset.id); }
    else if (action === "cancelPartyEdit"){ cancelPartyEdit(); }
    else if (action === "savePartyEdit"){ savePartyEdit(t.dataset.id); }
    else if (action === "deleteParty"){ if (!t.disabled) deleteParty(t.dataset.id); }
    else if (action === "setLoginMode"){ setLoginMode(t.dataset.value); }
    else if (action === "logout"){ logout(); }
    else if (action === "addDriver"){ addDriver(); }
    else if (action === "startDriverEdit"){ startDriverEdit(t.dataset.id); }
    else if (action === "cancelDriverEdit"){ cancelDriverEdit(); }
    else if (action === "saveDriverEdit"){ saveDriverEdit(t.dataset.id); }
    else if (action === "deleteDriver"){ deleteDriver(t.dataset.id); }
    else if (action === "changeAdminPw"){ changeAdminPassword(); }
  }
  function onSubmit(e){
    var f = e.target.closest("form[data-action-submit]");
    if (!f) return;
    e.preventDefault();
    var kind = f.dataset.actionSubmit;
    if (kind === "loginDriver"){ loginDriverSubmit(); }
    else if (kind === "loginAdmin"){ loginAdminSubmit(); }
    else { submitEntry(kind); }
  }
  function onInput(e){
    var el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    if (el.dataset.field === "editType"){ editingTypeValue = el.value; return; }
    if (el.dataset.field === "addType"){ formDrafts.addType = el.value; scheduleDraftSave(); return; }
    if (el.dataset.field === "editParty"){ editingPartyValue = el.value; return; }
    if (el.dataset.field === "addParty"){ formDrafts.addParty = el.value; scheduleDraftSave(); return; }
    if (el.dataset.field === "editDriverName"){ editingDriverName = el.value; return; }
    if (el.dataset.field === "editDriverPin"){ editingDriverPin = el.value; return; }
    var form = el.closest("[data-form]");
    if (form){
      var kind = form.dataset.form;
      if (kind === "_addType" || kind === "_addParty") return; // already handled above by field name
      if (formDrafts[kind]) formDrafts[kind][el.dataset.field] = el.value;
      // login / driver-PIN / admin-password fields hold credentials: keep them
      // in memory only, never mirrored into sessionStorage.
      if (kind !== "login" && kind !== "addDriver" && kind !== "adminPw"){
        scheduleDraftSave();
      }
    }
  }
  function onChange(e){
    var el = e.target;
    if (el.dataset && el.dataset.action === "setHistoryDrum"){ setHistoryDrum(el.value); return; }
    onInput(e);
    if (el.dataset && el.dataset.field === "partyId"){ render(); }
  }

  /* ---------- init ---------- */
  function restoreSession(){
    var raw = ls_get(SESSION_KEY);
    if (!raw) return;
    try {
      var s = JSON.parse(raw);
      if (s && s.role === "admin"){
        session = s;
      } else if (s && s.role === "driver" && s.driverId && STATE.drivers.some(function(d){ return d.id === s.driverId; })){
        session = s;
      } else {
        ls_del(SESSION_KEY);
      }
    } catch(e){ ls_del(SESSION_KEY); }
  }

  function init(){
    loadStateFromDOM();
    restoreSession();
    restoreDrafts();
    if (!formDrafts["in"].handler) formDrafts["in"].handler = lastHandler();
    if (!formDrafts["out"].handler) formDrafts["out"].handler = lastHandler();
    if (!formDrafts["in"].date) formDrafts["in"].date = todayStr();
    if (!formDrafts["out"].date) formDrafts["out"].date = todayStr();

    var flash = ss_get(FLASH_KEY);
    if (flash) ss_del(FLASH_KEY);
    var nextTab = ss_get(TAB_KEY);
    if (nextTab){ ss_del(TAB_KEY); activeTab = nextTab; }
    else if (session){ activeTab = session.role === "admin" ? "dashboard" : "in"; }
    if (session && allowedTabs().indexOf(activeTab) === -1){
      activeTab = session.role === "admin" ? "dashboard" : "in";
    }

    var app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("submit", onSubmit);
    app.addEventListener("input", onInput);
    app.addEventListener("change", onChange);

    render();
    if (flash) showToast(flash);

    if (window.claude && typeof window.claude.use === "function"){
      window.claude.use("artifact").then(function(ns){
        artifact = ns;
        hasSync = !!ns;
        render();
      }).catch(function(){ hasSync = false; render(); });
    } else {
      hasSync = false;
      render();
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
